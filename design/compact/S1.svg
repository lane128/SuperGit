  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
</g><text x="114" y="534" font-size="11" fill="#626c76" font-weight="400" data-max-width="104.28" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">…rnal/gitrepo/</text><text x="238.07" y="534" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" dominant-baseline="central" data-max-width="168" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >stage.go</text><text x="290" y="534" font-size="11" fill="#626c76" font-weight="400" data-max-width="30" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">go</text><text x="337" y="534" font-size="11" fill="#7d5516" font-weight="600" text-anchor="middle" dominant-baseline="central" data-max-width="16" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >M</text><g data-component="icon-button" data-mygo="ui.Button" data-state="normal" data-label="暂存当前文件" data-box="350,520,28,28"><rect x="350" y="520" width="28" height="28" rx="4" fill="#ffffff" stroke="#c9d1d9" /><g data-icon="plus" data-icon-source="lucide-static@0.468.0" data-icon-box="356,526,16,16" transform="translate(356 526) scale(0.6666666666666666)" fill="none" stroke="#2f5bd7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

</g><text x="114" y="590" font-size="11" fill="#626c76" font-weight="400" data-max-width="131.32" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">modules/</text><text x="184.18" y="590" font-size="13" fill="#1f2328" font-weight="400" text-anchor="middle" dominant-baseline="central" data-max-width="168" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >core</text><text x="290" y="590" font-size="11" fill="#626c76" font-weight="400" data-max-width="30" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">sub</text><text x="337" y="590" font-size="11" fill="#7d5516" font-weight="600" text-anchor="middle" dominant-baseline="central" data-max-width="16" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >M</text></g><text x="78" y="626" font-size="11" fill="#59636e" font-weight="400" data-max-width="400" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >同一份文件列表在 308px 窄栏中的实际尺寸。</text><text x="536" y="516" font-size="13" fill="#1f2328" font-weight="600" data-max-width="220" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >列宽与行为</text>undefined<line x1="64" y1="676" x2="1104" y2="676" stroke="#e4e8ec" stroke-width="1" /><text x="64" y="704" font-size="13" fill="#1f2328" font-weight="600" data-max-width="504" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径可牺牲，文件名不可牺牲</text><text x="64" y="726" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径使用左侧省略，保留最后的目录名；完整路径固定在 Diff 头部。名称过宽时右侧</text><text x="64" y="742" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >省略，并保留完整值的提示。</text><text x="600" y="704" font-size="13" fill="#1f2328" font-weight="600" data-max-width="504" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >选中不移动列</text><text x="600" y="726" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >选中只改变行底色；悬停操作占用预留槽位，文件名、类型和状态列保持不</text><text x="600" y="742" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >动。焦点环 2px 在行外绘制。</text><text x="64" y="884" font-size="13" fill="#59636e" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >间距基准 4px：控件间距 8 / 12，分组 16 / 24，面板内边距 24。</text><text x="64" y="912" font-size="13" fill="#59636e" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >类型列显示扩展名或 sub；状态列使用单字母，含义由分组与图例解释。</text></g></svg>
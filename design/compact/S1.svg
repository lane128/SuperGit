</g><text x="108" y="76" font-size="30" fill="#1f2328" font-weight="600" data-max-width="980" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >文字、密度与对齐</text><text x="64" y="120" font-size="16" fill="#59636e" font-weight="400" data-max-width="1038" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >所有窗口共用四级字号。文件列表 28px 单行，名称、路径、类型、状态各有固定列。</text><line x1="64" y1="146" x2="1104" y2="146" stroke="#c9d1d9" stroke-width="1" /><text x="64" y="196" font-size="20" fill="#1f2328" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >四级文字</text><text x="64" y="223" font-size="13" fill="#59636e" font-weight="400" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >字号与行高不随页面改变；代码和操作文字同为 13px。</text><text x="64" y="248" font-size="13" fill="#59636e" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >页面标题</text><text x="224" y="248" font-size="13" fill="#1f2328" font-weight="500" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >20 / 28</text><text x="340" y="248" font-size="11" fill="#59636e" font-weight="400" data-max-width="70" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >600</text><text x="440" y="248" font-size="13" fill="#1f2328" font-weight="400" data-max-width="380" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >页面与弹窗标题</text><line x1="64" y1="262" x2="560" y2="262" stroke="#e4e8ec" stroke-width="1" /><text x="64" y="288" font-size="13" fill="#59636e" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >分组标题</text><text x="224" y="288" font-size="13" fill="#1f2328" font-weight="500" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >15 / 24</text><text x="340" y="288" font-size="11" fill="#59636e" font-weight="400" data-max-width="70" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >600</text><text x="440" y="288" font-size="13" fill="#1f2328" font-weight="400" data-max-width="380" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >列表分组、局部结构</text><line x1="64" y1="302" x2="560" y2="302" stroke="#e4e8ec" stroke-width="1" /><text x="64" y="328" font-size="13" fill="#59636e" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >正文与操作</text><text x="224" y="328" font-size="13" fill="#1f2328" font-weight="500" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >13 / 20</text><text x="340" y="328" font-size="11" fill="#59636e" font-weight="400" data-max-width="70" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >400–600</text><text x="440" y="328" font-size="13" fill="#1f2328" font-weight="400" data-max-width="380" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >文件名、按钮、Diff、导航</text><line x1="64" y1="342" x2="560" y2="342" stroke="#e4e8ec" stroke-width="1" /><text x="64" y="368" font-size="13" fill="#59636e" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >辅助信息</text><text x="224" y="368" font-size="13" fill="#1f2328" font-weight="500" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >11 / 16</text><text x="340" y="368" font-size="11" fill="#59636e" font-weight="400" data-max-width="70" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >400–500</text><text x="440" y="368" font-size="13" fill="#1f2328" font-weight="400" data-max-width="380" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径、类型、SHA、行号</text><line x1="64" y1="382" x2="560" y2="382" stroke="#e4e8ec" stroke-width="1" /><text x="64" y="452" font-size="20" fill="#1f2328" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >28px 文件行：六列固定</text><text x="64" y="479" font-size="13" fill="#59636e" font-weight="400" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >文件名与路径共享左边界；路径可以从左侧截断，文件名不能。</text><rect x="64" y="500" width="440" height="152" rx="6" fill="#ffffff" stroke="#e4e8ec" /><g data-component="file-row" data-mygo="ui.Table" data-height="28" data-label="stage.go"><rect x="78" y="520" width="308" height="28" rx="0" fill="none" stroke="none" data-row-box="true"/><rect x="78" y="520" width="308" height="28" rx="0" fill="#e9effc" stroke="none" /><g data-icon="file" data-icon-source="lucide-static@0.468.0" data-icon-box="88,526,16,16" transform="translate(88 526) scale(0.6666666666666666)" fill="none" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

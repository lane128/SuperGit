<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="文字、密度与对齐"><title>文字、密度与对齐</title><g font-family="Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#f6f7f9" stroke="none" /><g data-icon="folder-git-2" data-icon-source="lucide-static@0.468.0" data-icon-box="64,48,30,30" transform="translate(64 48) scale(1.25)" fill="none" stroke="#2f5bd7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

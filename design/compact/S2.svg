utton" data-mygo="ui.Toolbar" data-state="normal" data-label="Push" data-box="208,424,64,28"><g data-button-content="true" data-center="240,438"><text x="240" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="54" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Push</text></g></g><text x="64" y="470" font-size="11" fill="#59636e" font-weight="400" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >ui.Button · 28px 控件</text><text x="428" y="244" font-size="13" fill="#1f2328" font-weight="600" data-max-width="320" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >B · 舒适桌面</text><text x="428" y="266" font-size="11" fill="#59636e" font-weight="400" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >28px 高，顶部高光与更宽内边距；适合触控板。</text><g data-component="button" data-mygo="ui.PrimaryButton" data-state="normal" data-label="提交暂存内容" data-box="428,310,160,28"><rect x="428" y="310" width="160" height="28" rx="4" fill="#2f5bd7" stroke="#2f5bd7" /><line x1="432" y1="311" x2="584" y2="311" stroke="#ffffff" stroke-width="1" opacity=".6"/><g data-button-content="true" data-center="508,324"><text x="508" y="324" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="140" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g></g><g data-component="button" data-mygo="ui.Button" data-state="normal" data-label="取消" data-box="428,348,72,28"><rect x="428" y="348" width="72" height="28" rx="4" fill="#ffffff" stroke="#c9d1d9" /><line x1="432" y1="349" x2="496" y2="349" stroke="#ffffff" stroke-width="1" opacity=".6"/><g data-button-content="true" data-center="464,362"><text x="464" y="362" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="52" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >取消</text></g></g><g data-component="button" data-mygo="ui.Button" data-state="disabled" data-label="暂存父指针" data-box="428,386,120,28"><rect x="428" y="386" width="120" height="28" rx="4" fill="#f6f8fa" stroke="#e4e8ec" /><line x1="432" y1="387" x2="544" y2="387" stroke="#ffffff" stroke-width="1" opacity=".6"/><g data-button-content="true" data-center="488,400"><text x="488" y="400" font-size="13" fill="#626c76" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="100" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >暂存父指针</text></g></g><g data-component="button" data-mygo="ui.Link" data-state="normal" data-label="查看详情" data-box="560,386,96,28"><rect x="560" y="386" width="96" height="28" rx="4" fill="none" stroke="none" /><g data-button-content="true" data-center="608,400"><text x="608" y="400" font-size="13" fill="#2f5bd7" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="76" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >查看详情</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Fetch" data-box="428,424,72,28"><g data-button-content="true" data-center="464,438"><text x="464" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="62" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Fetch</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Pull" data-box="508,424,56,28"><g data-button-content="true" data-center="536,438"><text x="536" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="46" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Pull</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Push" data-box="572,424,64,28"><g data-button-content="true" data-center="604,438"><text x="604" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="54" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Push</text></g></g><text x="428" y="470" font-size="11" fill="#59636e" font-weight="400" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >ui.Button · 样式链 .Padding/.Radius</text><text x="792" y="244" font-size="13" fill="#1f2328" font-weight="600" data-max-width="320" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >C · 低强调</text><text x="792" y="266" font-size="11" fill="#59636e" font-weight="400" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >默认按钮不描边，主操作仍用强调色。</text><g data-component="button" data-mygo="ui.PrimaryButton" data-state="normal" data-label="提交暂存内容" data-box="792,310,160,28"><rect x="792" y="310" width="160" height="28" rx="4" fill="#2f5bd7" stroke="#2f5bd7" /><g data-button-content="true" data-center="872,324"><text x="872" y="324" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="140" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g></g><g data-component="button" data-mygo="ui.Button" data-state="normal" data-label="取消" data-box="792,348,72,28"><rect x="792" y="348" width="72" height="28" rx="4" fill="#f6f8fa" stroke="none" /><g data-button-content="true" data-center="828,362"><text x="828" y="362" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="52" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >取消</text></g></g><g data-component="button" data-mygo="ui.Button" data-state="disabled" data-label="暂存父指针" data-box="792,386,120,28"><rect x="792" y="386" width="120" height="28" rx="4" fill="#f6f8fa" stroke="#e4e8ec" /><g data-button-content="true" data-center="852,400"><text x="852" y="400" font-size="13" fill="#626c76" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="100" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >暂存父指针</text></g></g><g data-component="button" data-mygo="ui.Link" data-state="normal" data-label="查看详情" data-box="924,386,96,28"><rect x="924" y="386" width="96" height="28" rx="4" fill="none" stroke="none" /><g data-button-content="true" data-center="972,400"><text x="972" y="400" font-size="13" fill="#2f5bd7" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="76" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >查看详情</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Fetch" data-box="792,424,72,28"><g data-button-content="true" data-center="828,438"><text x="828" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="62" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Fetch</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Pull" data-box="872,424,56,28"><g data-button-content="true" data-center="900,438"><text x="900" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="46" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Pull</text></g></g><g data-component="button" data-mygo="ui.Toolbar" data-state="normal" data-label="Push" data-box="936,424,64,28"><g data-button-content="true" data-center="968,438"><text x="968" y="438" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="54" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >Push</text></g></g><text x="792" y="470" font-size="11" fill="#59636e" font-weight="400" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >ui.Button · 无面默认态</text><text x="64" y="512" font-size="20" fill="#1f2328" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >提示：图标中心 = 文字组中心</text><text x="64" y="539" font-size="13" fill="#59636e" font-weight="400" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >两行提示把标题与辅助文字作为一个块，在 64px 容器内垂直居中；单行提示同理。</text><g data-component="notice" data-mygo="ui.Row" data-box="64,556,1040,40"><rect x="64" y="556" width="1040" height="40" rx="4" fill="#edf7f0" stroke="#e4e8ec" /><g data-notice-icon="true" data-center="86,576"><g data-icon="check" data-icon-source="lucide-static@0.468.0" data-icon-box="78,568,16,16" transform="translate(78 568) scale(0.6666666666666666)" fill="none" stroke="#24683f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 6 9 17l-5-5" />
</g></g><g data-notice-text="true" data-center-y="576"><text x="102" y="576" font-size="13" fill="#1f2328" font-weight="500" data-max-width="984" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">已创建提交 b71f9c2</text></g></g><g data-component="notice" data-mygo="ui.Row" data-box="64,608,1040,64"><rect x="64" y="608" width="1040" height="64" rx="4" fill="#fff7e5" stroke="#e4e8ec" /><g data-notice-icon="true" data-center="86,640"><g data-icon="triangle-alert" data-icon-source="lucide-static@0.468.0" data-icon-box="78,632,16,16" transform="translate(78 632) scale(0.6666666666666666)" fill="none" stroke="#7d5516" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" />
</g></g><g data-notice-text="true" data-center-y="640"><text x="102" y="630" font-size="13" fill="#1f2328" font-weight="600" data-max-width="984" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">core 内部有未提交文件</text><text x="102" y="651" font-size="11" fill="#59636e" font-weight="400" data-max-width="984" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">暂存父指针不会提交这些文件；先进入子模块处理。</text></g></g><g data-component="notice" data-mygo="ui.Row" data-box="64,684,1040,64"><rect x="64" y="684" width="1040" height="64" rx="4" fill="#fff0f0" stroke="#e4e8ec" /><g data-notice-icon="true" data-center="86,716"><g data-icon="triangle-alert" data-icon-source="lucide-static@0.468.0" data-icon-box="78,708,16,16" transform="translate(78 708) scale(0.6666666666666666)" fill="none" stroke="#a92c3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" />
</g></g><g data-notice-text="true" data-center-y="716"><text x="102" y="706" font-size="13" fill="#1f2328" font-weight="600" data-max-width="856" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">stage.go 的差异读取失败</text><text x="102" y="727" font-size="11" fill="#59636e" font-weight="400" data-max-width="856" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" dominant-baseline="central">列表与草稿保留；重试只针对当前文件。</text></g><g data-component="button" data-mygo="ui.Button" data-state="normal" data-label="重试读取" data-box="986,702,104,28"><rect x="986" y="702" width="104" height="28" rx="4" fill="#ffffff" stroke="#c9d1d9" /><g data-button-content="true" data-center="1038,716"><text x="1038" y="716" font-size="13" fill="#1f2328" font-weight="500" text-anchor="middle" dominant-baseline="central" data-max-width="84" data-type="centered" font-family="Helvetica Neue,PingFang SC,sans-serif" >重试读取</text></g></g></g><text x="64" y="776" font-size="11" fill="#59636e" font-weight="400" data-max-width="1040" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >对齐检查：单行提示的图标中心与文字组中心同在 y=574；两行提示同在 y=640（本页实测）。</text><text x="64" y="800" font-size="13" fill="#1f2328" font-weight="600" data-max-width="504" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >按钮状态来自 MyGo</text><text x="64" y="822" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >默认、悬停、按下、焦点、不可用都有主题 token；等待状态用 Spinner + 禁用按</text><text x="64" y="838" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >钮，不伪造按钮内建 loading。</text><text x="600" y="800" font-size="13" fill="#1f2328" font-weight="600" data-max-width="504" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >语义不靠颜色单独承担</text><text x="600" y="822" font-size="11" fill="#59636e" font-weight="400" data-max-width="504" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >危险动作用 AlertDialog 与明确对象；成功、警告、错误同时给出图标、标题与可执行下一步。</text><text x="64" y="918" font-size="13" fill="#59636e" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >按钮标签保持动词开头：提交、暂存、重试、打开。同一动作在全流程使用同一名称。</text><text x="64" y="946" font-size="13" fill="#59636e" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提示中的操作按钮不挤压正文：正文可用宽度 = 容器宽 − 图标区 − 操作区。</text></g></svg>
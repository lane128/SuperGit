<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="A4 克隆失败与重试"><title>A4 克隆失败与重试</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#f3f5f8" stroke="#c4cedb" /><circle cx="20" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="38" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="56" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="471" y="26" font-size="14" fill="#253044" font-weight="650" data-max-width="170" >SuperGit</text><line x1="0" y1="44" x2="1040" y2="44" stroke="#dce3ec" stroke-width="1" /><text x="71" y="121" font-size="28" fill="#253044" font-weight="600" data-max-width="650" >仓库</text><g><rect x="70" y="153" width="171" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><g transform="translate(79 160) scale(0.7222222222222222)"><path d="M1 5V3h6l2 2h7v11H1z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="171" font-size="11" fill="#ffffff" font-weight="500" data-max-width="132" >打开现有仓库</text></g><g><rect x="252" y="153" width="141" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><g transform="translate(261 160) scale(0.7222222222222222)"><path d="M4 13a4 4 0 0 1 0-8a5 5 0 0 1 10-1a4 4 0 0 1 0 9M9 9v8" fill="none" stroke="#253044" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="283" y="171" font-size="11" fill="#253044" font-weight="500" data-max-width="102" >克隆仓库</text></g><g><rect x="404" y="153" width="171" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><g transform="translate(413 160) scale(0.7222222222222222)"><path d="M9 2v14M2 9h14" fill="none" stroke="#253044" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="435" y="171" font-size="11" fill="#253044" font-weight="500" data-max-width="132" >初始化新仓库</text></g><text x="72" y="253" font-size="12" fill="#566477" font-weight="600" data-max-width="700" >最近打开</text><line x1="70" y1="278" x2="970" y2="278" stroke="#dce3ec" stroke-width="1" /><g transform="translate(78 302) scale(1.1666666666666667)"><path d="M1 5V3h6l2 2h7v11H1z" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="309" font-size="15" fill="#253044" font-weight="600" data-max-width="450" >atlas</text><text x="116" y="334" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="530" >~/Projects/atlas</text><text x="720" y="313" font-size="11" fill="#566477" font-weight="400" data-max-width="227" >feature/partial-stage</text><line x1="70" y1="363" x2="970" y2="363" stroke="#dce3ec" stroke-width="1" /><g transform="translate(78 387) scale(1.1666666666666667)"><path d="M1 5V3h6l2 2h7v11H1z" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="394" font-size="15" fill="#253044" font-weight="600" data-max-width="450" >core</text><text x="116" y="419" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="530" >~/Projects/atlas/modules/core</text><text x="720" y="398" font-size="11" fill="#566477" font-weight="400" data-max-width="227" >feature/index-cache</text><line x1="70" y1="448" x2="970" y2="448" stroke="#dce3ec" stroke-width="1" /><g transform="translate(78 472) scale(1.1666666666666667)"><path d="M1 5V3h6l2 2h7v11H1z" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="479" font-size="15" fill="#253044" font-weight="600" data-max-width="450" >sandbox</text><text x="116" y="504" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="530" >~/Projects/sandbox</text><text x="720" y="483" font-size="11" fill="#566477" font-weight="400" data-max-width="227" >main</text><text x="73" y="641" font-size="11" fill="#566477" font-weight="400" data-max-width="880" >最近路径失效时保留记录，并提供重新选择路径。</text><rect x="1" y="1" width="1038" height="698" rx="9" fill="#253044" stroke="none" opacity=".25"/><rect x="269" y="197" width="558" height="382" rx="13" fill="#ffffff" stroke="#c4cedb" /><text x="294" y="235" font-size="19" fill="#253044" font-weight="600" data-max-width="508" >克隆未完成</text><text x="294" y="263" font-size="12" fill="#566477" font-weight="400" data-max-width="508" >认证失败。检查系统凭据助手或 SSH agent 后重试。</text><line x1="294" y1="301" x2="802" y2="301" stroke="#dce3ec" stroke-width="1" /><text x="294" y="330" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >来源</text><text x="384" y="330" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >example.invalid/team/atlas.git</text><text x="294" y="368" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >目标</text><text x="384" y="368" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >~/Projects/atlas</text><text x="294" y="406" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >重试检查</text><text x="384" y="406" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >先确认目标目录是否已有内容</text><text x="294" y="502" font-size="11" fill="#aa454c" font-weight="500" data-max-width="508" >原始信息：Authentication failed</text><g><rect x="605" y="530" width="86" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="617" y="548" font-size="11" fill="#253044" font-weight="500" data-max-width="66" >取消</text></g><g><rect x="702" y="530" width="100" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><text x="714" y="548" font-size="11" fill="#ffffff" font-weight="500" data-max-width="80" >检查并重试</text></g></g></svg>
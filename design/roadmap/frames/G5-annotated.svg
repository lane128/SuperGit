<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="G5 快捷键搜索与冲突与说明"><title>G5 快捷键搜索与冲突与说明</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#edf1f6" stroke="none" /><g id="G5" data-frame="G5"><text x="64" y="82" font-size="23" fill="#253044" font-weight="600" data-max-width="806" >G5  快捷键搜索与冲突</text><rect x="935" y="59" width="169" height="28" rx="5" fill="#e0e8f2" stroke="none" /><text x="947" y="78" font-size="12" fill="#253044" font-weight="600" data-max-width="147" >R2  新增提案</text><svg x="64" y="108" width="1040" height="700" viewBox="0 0 1040 700" overflow="hidden"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#e8edf3" stroke="#c4cedb" /><circle cx="18" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="35" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="52" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="474" y="25" font-size="13" fill="#253044" font-weight="600" data-max-width="210" >SuperGit 设置</text><line x1="0" y1="43" x2="1040" y2="43" stroke="#dce3ec" stroke-width="1" /><g transform="translate(24 72) scale(0.7777777777777778)"><path d="M6 1h6l1 3l3 2v6l-3 2l-1 3H6l-1-3l-3-2V6l3-2zM12 9a3 3 0 1 1-6 0a3 3 0 1 1 6 0" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="84" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >常规</text><g transform="translate(24 111) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="123" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外观与布局</text><g transform="translate(24 150) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="162" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >差异与历史</text><rect x="12" y="182" width="166" height="33" rx="6" fill="#e6eef8" stroke="none" /><g transform="translate(24 189) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM6 11h6M9 8v6" fill="none" stroke="#386ba7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="201" font-size="12" fill="#386ba7" font-weight="600" data-max-width="120" >快捷键</text><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >Git 与仓库</text><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >快捷键</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >应用设置 · 当前值自动保存</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="163" width="777" height="32" rx="6" fill="#ffffff" stroke="#386ba7" /><text x="231" y="183" font-size="12" fill="#253044" font-weight="400" data-max-width="753" >搜索命令或快捷键</text><rect x="220" y="211" width="778" height="31" rx="0" fill="#f4f7fa" stroke="none" /><text x="234" y="232" font-size="11" fill="#566477" font-weight="500" data-max-width="430" >命令</text><text x="760" y="232" font-size="11" fill="#566477" font-weight="500" data-max-width="211" >快捷键</text><text x="234" y="270" font-size="12" fill="#253044" font-weight="400" data-max-width="480" >提交暂存内容</text><rect x="750" y="249" width="231" height="32" rx="6" fill="#ffffff" stroke="#aa454c" /><text x="761" y="269" font-size="12" fill="#253044" font-weight="400" data-max-width="207" >⌘ Enter</text><line x1="220" y1="289" x2="998" y2="289" stroke="#dce3ec" stroke-width="1" /><text x="234" y="316" font-size="12" fill="#253044" font-weight="400" data-max-width="480" >打开仓库</text><rect x="750" y="295" width="231" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="761" y="315" font-size="12" fill="#253044" font-weight="400" data-max-width="207" >⌘ O</text><line x1="220" y1="335" x2="998" y2="335" stroke="#dce3ec" stroke-width="1" /><text x="234" y="362" font-size="12" fill="#253044" font-weight="400" data-max-width="480" >刷新当前仓库</text><rect x="750" y="341" width="231" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="761" y="361" font-size="12" fill="#253044" font-weight="400" data-max-width="207" >⌘ R</text><line x1="220" y1="381" x2="998" y2="381" stroke="#dce3ec" stroke-width="1" /><text x="234" y="408" font-size="12" fill="#253044" font-weight="400" data-max-width="480" >聚焦历史搜索</text><rect x="750" y="387" width="231" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="761" y="407" font-size="12" fill="#253044" font-weight="400" data-max-width="207" >⌘ F</text><line x1="220" y1="427" x2="998" y2="427" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="486" width="778" height="64" rx="6" fill="#fbefef" stroke="none" /><g transform="translate(233 500) scale(0.8333333333333334)"><path d="M9 1L0 17h18zM9 6v5M9 14h.01" fill="none" stroke="#aa454c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="259" y="510" font-size="12" fill="#aa454c" font-weight="600" data-max-width="724" >⌘ Enter 已被“提交暂存内容”使用</text><text x="259" y="529" font-size="11" fill="#aa454c" font-weight="400" data-max-width="724" >选择其他组合，或先移除原命令的绑定；冲突时不保存。</text><g><rect x="220" y="608" width="196" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="232" y="626" font-size="11" fill="#253044" font-weight="500" data-max-width="176" >恢复默认快捷键…</text></g></svg><text x="64" y="836" font-size="12" fill="#566477" font-weight="600" data-max-width="1040" >现有固定快捷键，自定义提案</text><text x="64" y="862" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >命令可搜索；录入冲突明确显示占用者并拒绝保存。</text><text x="64" y="888" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >macOS 用 ⌘；后续 Windows / Linux 用对应平台键名。</text><text x="64" y="917" font-size="12" fill="#566477" font-weight="400" data-max-width="1040" >关联状态待细化：按命令搜索 / 键位冲突 / 恢复默认键位</text></g></g></svg>
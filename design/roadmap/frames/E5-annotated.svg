="730" >远端分支</text><text x="197" y="619" font-size="12" fill="#566477" font-weight="400" data-max-width="789" >origin/main     origin/feature/partial-stage</text><rect x="1" y="1" width="1038" height="698" rx="9" fill="#253044" stroke="none" opacity=".25"/><rect x="269" y="197" width="558" height="382" rx="13" fill="#ffffff" stroke="#c4cedb" /><text x="294" y="235" font-size="19" fill="#253044" font-weight="600" data-max-width="508" >无法仅快进拉取</text><text x="294" y="263" font-size="12" fill="#566477" font-weight="400" data-max-width="508" >本地和远端历史已经分叉。选择明确的整合方式后继续。</text><line x1="294" y1="301" x2="802" y2="301" stroke="#dce3ec" stroke-width="1" /><text x="294" y="330" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >本地</text><text x="384" y="330" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >feature/partial-stage · 领先 2</text><text x="294" y="368" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >远端</text><text x="384" y="368" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >origin/feature/partial-stage · 领先 3</text><text x="294" y="406" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >可选</text><text x="384" y="406" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >Merge 或普通 Rebase</text><text x="294" y="502" font-size="11" fill="#aa454c" font-weight="500" data-max-width="508" >不会自动执行强制覆盖。</text><g><rect x="605" y="530" width="86" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="617" y="548" font-size="11" fill="#253044" font-weight="500" data-max-width="66" >取消</text></g><g><rect x="702" y="530" width="100" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><text x="714" y="548" font-size="11" fill="#ffffff" font-weight="500" data-max-width="80" >查看整合操作</text></g></svg><text x="64" y="836" font-size="12" fill="#566477" font-weight="600" data-max-width="1040" >已有能力</text><text x="64" y="862" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >仅快进拉取受阻；由用户选择 Merge 或普通 Rebase。</text><text x="64" y="888" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >不提供强制覆盖开关；进入 F3 / F4 处理整合。</text><text x="64" y="917" font-size="12" fill="#566477" font-weight="400" data-max-width="1040" >关联状态待细化：可快进 / 历史分叉 / 本地改动受阻</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="G4 Diff 与历史阅读偏好"><title>G4 Diff 与历史阅读偏好</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#e8edf3" stroke="#c4cedb" /><circle cx="18" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="35" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="52" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="474" y="25" font-size="13" fill="#253044" font-weight="600" data-max-width="210" >SuperGit 设置</text><line x1="0" y1="43" x2="1040" y2="43" stroke="#dce3ec" stroke-width="1" /><g transform="translate(24 72) scale(0.7777777777777778)"><path d="M6 1h6l1 3l3 2v6l-3 2l-1 3H6l-1-3l-3-2V6l3-2zM12 9a3 3 0 1 1-6 0a3 3 0 1 1 6 0" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="84" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >常规</text><g transform="translate(24 111) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="123" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外观与布局</text><rect x="12" y="143" width="166" height="33" rx="6" fill="#e6eef8" stroke="none" /><g transform="translate(24 150) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#386ba7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="162" font-size="12" fill="#386ba7" font-weight="600" data-max-width="120" >差异与历史</text><g transform="translate(24 189) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM6 11h6M9 8v6" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="201" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >快捷键</text><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >Git 与仓库</text><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >差异与历史</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >应用设置 · 当前值自动保存</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><text x="220" y="182" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >默认差异视图</text><text x="220" y="204" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >统一 / 左右；单个仓库记住当前视图。</text><rect x="720" y="165" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="185" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >统一</text><g transform="translate(959 174) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="224" x2="999" y2="224" stroke="#dce3ec" stroke-width="1" /><text x="220" y="254" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >制表符宽度</text><text x="220" y="276" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >只影响显示，不修改文件内容。</text><rect x="720" y="237" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="257" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >4 个空格</text><g transform="translate(959 246) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="296" x2="999" y2="296" stroke="#dce3ec" stroke-width="1" /><text x="220" y="326" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >长行换行</text><text x="220" y="348" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >关闭时横向滚动，保持代码列对齐。</text><rect x="720" y="309" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="329" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >关闭</text><g transform="translate(959 318) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="368" x2="999" y2="368" stroke="#dce3ec" stroke-width="1" /><text x="220" y="398" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >空白显示</text><text x="220" y="420" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >忽略空白仅影响比较，不修改暂存补丁。</text><rect x="720" y="381" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="401" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >显示改动中的空白</text><g transform="translate(959 390) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="440" x2="999" y2="440" stroke="#dce3ec" stroke-width="1" /><text x="220" y="470" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >历史元数据列</text><text x="220" y="492" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >提交说明优先，SHA 可在详情中完整复制。</text><rect x="720" y="453" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="473" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >作者与时间</text><g transform="translate(959 462) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="512" x2="999" y2="512" stroke="#dce3ec" stroke-width="1" /><text x="220" y="542" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >线图轨道</text><text x="220" y="564" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >竖直主线、短折线、小圆角；过滤不改变轨道。</text><text x="720" y="545" font-size="12" fill="#566477" font-weight="500" data-max-width="260" >固定直线轨道</text><line x1="220" y1="584" x2="999" y2="584" stroke="#dce3ec" stroke-width="1" /><text x="220" y="638" font-size="11" fill="#566477" font-weight="500" data-max-width="771" >走线规则固定，不增加自由曲线、波浪线等装饰设置。</text></g></svg>
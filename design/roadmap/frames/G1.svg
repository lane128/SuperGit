<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="G1 常规与语言选择"><title>G1 常规与语言选择</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#e8edf3" stroke="#c4cedb" /><circle cx="18" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="35" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="52" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="474" y="25" font-size="13" fill="#253044" font-weight="600" data-max-width="210" >SuperGit 设置</text><line x1="0" y1="43" x2="1040" y2="43" stroke="#dce3ec" stroke-width="1" /><rect x="12" y="65" width="166" height="33" rx="6" fill="#e6eef8" stroke="none" /><g transform="translate(24 72) scale(0.7777777777777778)"><path d="M6 1h6l1 3l3 2v6l-3 2l-1 3H6l-1-3l-3-2V6l3-2zM12 9a3 3 0 1 1-6 0a3 3 0 1 1 6 0" fill="none" stroke="#386ba7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="84" font-size="12" fill="#386ba7" font-weight="600" data-max-width="120" >常规</text><g transform="translate(24 111) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="123" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外观与布局</text><g transform="translate(24 150) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="162" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >差异与历史</text><g transform="translate(24 189) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM6 11h6M9 8v6" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="201" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >快捷键</text><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >Git 与仓库</text><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >常规</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >应用设置 · 当前值自动保存</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><text x="220" y="182" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >界面语言</text><text x="220" y="204" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >跟随系统、简体中文或 English；保留当前草稿与选择。</text><rect x="720" y="165" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="185" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >简体中文</text><g transform="translate(959 174) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="224" x2="999" y2="224" stroke="#dce3ec" stroke-width="1" /><text x="220" y="256" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >启动时显示</text><text x="220" y="278" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >没有可恢复仓库时进入仓库入口。</text><rect x="720" y="239" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="259" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >最近使用的仓库</text><g transform="translate(959 248) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="298" x2="999" y2="298" stroke="#dce3ec" stroke-width="1" /><text x="220" y="330" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >日期与时间</text><text x="220" y="352" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >按钮、菜单、提示、错误摘要与复数形式一起切换。</text><text x="720" y="333" font-size="12" fill="#566477" font-weight="500" data-max-width="260" >跟随语言环境</text><line x1="220" y1="372" x2="999" y2="372" stroke="#dce3ec" stroke-width="1" /><rect x="713" y="201" width="276" height="133" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="730" y="229" font-size="12" fill="#253044" font-weight="400" data-max-width="230" >跟随系统</text><rect x="720" y="240" width="263" height="34" rx="4" fill="#e6eef8" stroke="none" /><text x="730" y="262" font-size="12" fill="#386ba7" font-weight="600" data-max-width="230" >✓  简体中文</text><text x="730" y="300" font-size="12" fill="#253044" font-weight="400" data-max-width="230" >English</text><rect x="220" y="428" width="778" height="64" rx="6" fill="#eaf5ee" stroke="none" /><g transform="translate(233 442) scale(0.8333333333333334)"><path d="M2 9l4 4L16 3" fill="none" stroke="#237047" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="259" y="452" font-size="12" fill="#237047" font-weight="600" data-max-width="724" >只翻译软件界面</text><text x="259" y="471" font-size="11" fill="#237047" font-weight="400" data-max-width="724" >分支、路径、提交说明和原始 Git 输出保持原文。</text><text x="221" y="551" font-size="11" fill="#566477" font-weight="400" data-max-width="766" >当前客户端仅中文；此页为多语言设计提案。</text></g></svg>
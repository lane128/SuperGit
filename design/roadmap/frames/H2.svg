<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="H2 外部工具配置"><title>H2 外部工具配置</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#e8edf3" stroke="#c4cedb" /><circle cx="18" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="35" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="52" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="474" y="25" font-size="13" fill="#253044" font-weight="600" data-max-width="210" >SuperGit 设置</text><line x1="0" y1="43" x2="1040" y2="43" stroke="#dce3ec" stroke-width="1" /><g transform="translate(24 72) scale(0.7777777777777778)"><path d="M6 1h6l1 3l3 2v6l-3 2l-1 3H6l-1-3l-3-2V6l3-2zM12 9a3 3 0 1 1-6 0a3 3 0 1 1 6 0" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="84" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >常规</text><g transform="translate(24 111) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="123" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外观与布局</text><g transform="translate(24 150) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="162" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >差异与历史</text><g transform="translate(24 189) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM6 11h6M9 8v6" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="201" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >快捷键</text><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >Git 与仓库</text><rect x="12" y="260" width="166" height="33" rx="6" fill="#e6eef8" stroke="none" /><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#386ba7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#386ba7" font-weight="600" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >外部工具</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >应用设置 · 当前值自动保存</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="165" width="778" height="64" rx="6" fill="#fbf5e9" stroke="none" /><g transform="translate(233 179) scale(0.8333333333333334)"><path d="M9 1L0 17h18zM9 6v5M9 14h.01" fill="none" stroke="#946721" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="259" y="189" font-size="12" fill="#946721" font-weight="600" data-max-width="724" >后续提案 · 工具配置尚未实现</text><text x="259" y="208" font-size="11" fill="#946721" font-weight="400" data-max-width="724" >选择可执行文件并验证路径，不在选择时运行外部命令。</text><text x="220" y="271" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >外部编辑器</text><text x="220" y="293" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >用于打开选中文件；不处理认证。</text><rect x="720" y="254" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="274" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >系统默认</text><g transform="translate(959 263) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="313" x2="999" y2="313" stroke="#dce3ec" stroke-width="1" /><text x="220" y="345" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >外部 Diff 工具</text><text x="220" y="367" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >内置 Diff 仍是默认。</text><rect x="720" y="328" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="348" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >未设置</text><g transform="translate(959 337) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="387" x2="999" y2="387" stroke="#dce3ec" stroke-width="1" /><text x="220" y="419" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >外部 Merge 工具</text><text x="220" y="441" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >工具生成结果后仍需检查并标记冲突已解决。</text><rect x="720" y="402" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="422" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >未设置</text><g transform="translate(959 411) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="461" x2="999" y2="461" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="498" width="777" height="32" rx="6" fill="#ffffff" stroke="#aa454c" /><text x="231" y="518" font-size="12" fill="#253044" font-weight="400" data-max-width="753" >/Applications/Example Editor.app</text><text x="221" y="550" font-size="11" fill="#aa454c" font-weight="500" data-max-width="770" >路径不可用：请选择存在且可执行的应用。</text><g><rect x="220" y="595" width="150" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="232" y="613" font-size="11" fill="#253044" font-weight="500" data-max-width="130" >选择应用…</text></g><g><rect x="797" y="595" width="201" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="809" y="613" font-size="11" fill="#253044" font-weight="500" data-max-width="181" >验证路径</text></g></g></svg>
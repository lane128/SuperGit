und" /></g><text x="49" y="201" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >快捷键</text><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >Git 与仓库</text><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >外观与布局</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >应用设置 · 当前值自动保存</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><text x="220" y="181" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >外观</text><text x="220" y="203" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >跟随系统 / 浅色 / 深色。</text><rect x="720" y="164" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="184" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >浅色</text><g transform="translate(959 173) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="223" x2="999" y2="223" stroke="#dce3ec" stroke-width="1" /><text x="220" y="252" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >界面缩放</text><text x="220" y="274" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >界面字号与代码字号独立。</text><rect x="720" y="235" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="255" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >100%</text><g transform="translate(959 244) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="294" x2="999" y2="294" stroke="#dce3ec" stroke-width="1" /><text x="220" y="323" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >信息密度</text><text x="220" y="345" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >舒适 36px 行；紧凑 28px 行。</text><rect x="720" y="306" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="326" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >舒适</text><g transform="translate(959 315) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="365" x2="999" y2="365" stroke="#dce3ec" stroke-width="1" /><text x="220" y="394" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >代码字体</text><text x="220" y="416" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >系统界面文字由系统字体与中文回退负责。</text><rect x="720" y="377" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="397" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >SF Mono / Menlo</text><g transform="translate(959 386) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="436" x2="999" y2="436" stroke="#dce3ec" stroke-width="1" /><text x="220" y="465" font-size="13" fill="#253044" font-weight="500" data-max-width="390" >代码字号</text><text x="220" y="487" font-size="11" fill="#566477" font-weight="400" data-max-width="438" >范围 11–19px；不改变 Git 数据。</text><rect x="720" y="448" width="263" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="731" y="468" font-size="12" fill="#253044" font-weight="400" data-max-width="239" >13 px</text><g transform="translate(959 457) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="220" y1="507" x2="999" y2="507" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="524" width="778" height="87" rx="6" fill="#f4f7fa" stroke="#dce3ec" /><text x="239" y="550" font-size="13" fill="#253044" font-weight="600" data-max-width="735" >预览：选中提交与代码</text><rect x="234" y="565" width="750" height="29" rx="4" fill="#e6eef8" stroke="none" /><text x="247" y="585" font-size="12" fill="#253044" font-weight="500" data-max-width="725" >b71f9c2   保留部分暂存后的工作区版本</text><g><rect x="220" y="633" width="184" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="232" y="651" font-size="11" fill="#253044" font-weight="500" data-max-width="164" >恢复本分类默认…</text></g><g><rect x="809" y="633" width="190" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="821" y="651" font-size="11" fill="#253044" font-weight="500" data-max-width="170" >恢复面板布局…</text></g></g></svg>
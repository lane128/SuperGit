<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="H5 离开未保存的 Git 设置与说明"><title>H5 离开未保存的 Git 设置与说明</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#edf1f6" stroke="none" /><g id="H5" data-frame="H5"><text x="64" y="82" font-size="23" fill="#253044" font-weight="600" data-max-width="806" >H5  离开未保存的 Git 设置</text><rect x="935" y="59" width="169" height="28" rx="5" fill="#e0e8f2" stroke="none" /><text x="947" y="78" font-size="12" fill="#253044" font-weight="600" data-max-width="147" >R2  新增提案</text><svg x="64" y="108" width="1040" height="700" viewBox="0 0 1040 700" overflow="hidden"><rect x="0" y="0" width="1040" height="700" rx="10" fill="#e8edf3" stroke="#c4cedb" /><circle cx="18" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="35" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><circle cx="52" cy="19" r="5" fill="none" stroke="#5d6a7c" stroke-width="1"/><text x="474" y="25" font-size="13" fill="#253044" font-weight="600" data-max-width="210" >SuperGit 设置</text><line x1="0" y1="43" x2="1040" y2="43" stroke="#dce3ec" stroke-width="1" /><g transform="translate(24 72) scale(0.7777777777777778)"><path d="M6 1h6l1 3l3 2v6l-3 2l-1 3H6l-1-3l-3-2V6l3-2zM12 9a3 3 0 1 1-6 0a3 3 0 1 1 6 0" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="84" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >常规</text><g transform="translate(24 111) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="123" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外观与布局</text><g transform="translate(24 150) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="162" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >差异与历史</text><g transform="translate(24 189) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM6 11h6M9 8v6" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="201" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >快捷键</text><rect x="12" y="221" width="166" height="33" rx="6" fill="#e6eef8" stroke="none" /><g transform="translate(24 228) scale(0.7777777777777778)"><path d="M4 2v10a3 3 0 0 0 3 3h3M4 6h5a3 3 0 0 0 3-3M2 2h4M10 2h4M9 15h5" fill="none" stroke="#386ba7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="240" font-size="12" fill="#386ba7" font-weight="600" data-max-width="120" >Git 与仓库</text><g transform="translate(24 267) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="279" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >外部工具</text><g transform="translate(24 306) scale(0.7777777777777778)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="318" font-size="12" fill="#253044" font-weight="400" data-max-width="120" >诊断与记录</text><text x="25" y="638" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >应用偏好即时预览</text><text x="25" y="657" font-size="10" fill="#5d6a7c" font-weight="400" data-max-width="145" >Git 配置需明确保存</text><rect x="192" y="54" width="835" height="632" rx="8" fill="#ffffff" stroke="#dce3ec" /><text x="219" y="92" font-size="22" fill="#253044" font-weight="600" data-max-width="650" >Git 与仓库</text><text x="219" y="119" font-size="11" fill="#566477" font-weight="400" data-max-width="700" >配置来源和写入范围始终可见</text><line x1="219" y1="140" x2="999" y2="140" stroke="#dce3ec" stroke-width="1" /><rect x="220" y="164" width="778" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="231" y="184" font-size="12" fill="#253044" font-weight="400" data-max-width="754" >当前仓库：atlas（仅写入此仓库的 Git 配置）</text><g transform="translate(974 173) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#566477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="220" y="223" font-size="12" fill="#253044" font-weight="600" data-max-width="480" >Git 可执行文件</text><text x="720" y="223" font-size="11" fill="#566477" font-weight="500" data-max-width="270" >/usr/bin/git · 已检测</text><line x1="220" y1="245" x2="998" y2="245" stroke="#dce3ec" stroke-width="1" /><text x="220" y="279" font-size="13" fill="#253044" font-weight="500" data-max-width="350" >提交者名称</text><rect x="220" y="293" width="778" height="32" rx="6" fill="#ffffff" stroke="#386ba7" /><text x="231" y="313" font-size="12" fill="#253044" font-weight="400" data-max-width="754" >dev</text><text x="220" y="357" font-size="13" fill="#253044" font-weight="500" data-max-width="350" >提交者邮箱</text><rect x="220" y="371" width="778" height="32" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="231" y="391" font-size="12" fill="#253044" font-weight="400" data-max-width="754" >dev@example.invalid</text><text x="220" y="433" font-size="11" fill="#566477" font-weight="400" data-max-width="775" >来源：当前仓库覆盖全局设置</text><rect x="220" y="468" width="778" height="64" rx="6" fill="#eaf5ee" stroke="none" /><g transform="translate(233 482) scale(0.8333333333333334)"><path d="M2 9l4 4L16 3" fill="none" stroke="#237047" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="259" y="492" font-size="12" fill="#237047" font-weight="600" data-max-width="724" >保存范围：atlas 的 Git 配置</text><text x="259" y="511" font-size="11" fill="#237047" font-weight="400" data-max-width="724" >其他仓库和全局身份不会被此次保存覆盖。</text><g><rect x="220" y="594" width="167" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="232" y="612" font-size="11" fill="#253044" font-weight="500" data-max-width="147" >继承全局身份</text></g><g><rect x="800" y="594" width="198" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><text x="812" y="612" font-size="11" fill="#ffffff" font-weight="500" data-max-width="178" >保存到此仓库</text></g><text x="220" y="660" font-size="10" fill="#566477" font-weight="400" data-max-width="775" >Git 路径与签名状态只读检测；不会在此保存凭据。</text><rect x="1" y="1" width="1038" height="698" rx="9" fill="#253044" stroke="none" opacity=".25"/><rect x="269" y="197" width="558" height="334" rx="13" fill="#ffffff" stroke="#c4cedb" /><text x="294" y="235" font-size="19" fill="#253044" font-weight="600" data-max-width="508" >保存 atlas 的身份修改？</text><text x="294" y="263" font-size="12" fill="#566477" font-weight="400" data-max-width="508" >即将离开 Git 设置。应用外观偏好已经即时保存，此处仅涉及 Git 配置。</text><line x1="294" y1="301" x2="802" y2="301" stroke="#dce3ec" stroke-width="1" /><text x="294" y="330" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >范围</text><text x="384" y="330" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >当前仓库 atlas</text><text x="294" y="368" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >未保存项</text><text x="384" y="368" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >提交者名称与邮箱</text><text x="294" y="406" font-size="11" fill="#5d6a7c" font-weight="400" data-max-width="80" >放弃修改</text><text x="384" y="406" font-size="11" fill="#253044" font-weight="500" data-max-width="418" >仅放弃本次表单输入</text><g><rect x="605" y="482" width="86" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="617" y="500" font-size="11" fill="#253044" font-weight="500" data-max-width="66" >继续编辑</text></g><g><rect x="702" y="482" width="100" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><text x="714" y="500" font-size="11" fill="#ffffff" font-weight="500" data-max-width="80" >保存到仓库</text></g><g><rect x="294" y="482" width="116" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="306" y="500" font-size="11" fill="#253044" font-weight="500" data-max-width="96" >放弃修改</text></g></svg><text x="64" y="836" font-size="12" fill="#566477" font-weight="600" data-max-width="1040" >新增提案</text><text x="64" y="862" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >仅未保存的 Git 配置触发离开确认，应用外观即时保存。</text><text x="64" y="888" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >“继续编辑 / 放弃修改 / 保存”明确作用于本仓库身份。</text><text x="64" y="917" font-size="12" fill="#566477" font-weight="400" data-max-width="1040" >关联状态待细化：继续编辑 / 放弃本次输入 / 保存失败仍留在原页</text></g></g></svg>
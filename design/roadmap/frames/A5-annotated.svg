rect x="605" y="482" width="86" height="28" rx="6" fill="#ffffff" stroke="#c4cedb" /><text x="617" y="500" font-size="11" fill="#253044" font-weight="500" data-max-width="66" >取消</text></g><g><rect x="702" y="482" width="100" height="28" rx="6" fill="#386ba7" stroke="#386ba7" /><text x="714" y="500" font-size="11" fill="#ffffff" font-weight="500" data-max-width="80" >创建仓库</text></g></svg><text x="64" y="836" font-size="12" fill="#566477" font-weight="600" data-max-width="1040" >已有能力</text><text x="64" y="862" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >目标是新目录；初始化成功后进入 B1。</text><text x="64" y="888" font-size="15" fill="#253044" font-weight="400" data-max-width="1040" >选择父目录再填写名称；失败保留表单。</text><text x="64" y="917" font-size="12" fill="#566477" font-weight="400" data-max-width="1040" >关联状态待细化：目录有效 / 创建中 / 失败重试</text></g></g></svg>
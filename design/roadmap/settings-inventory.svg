<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="2280" viewBox="0 0 1600 2280" role="img" aria-label="SuperGit 设置清单"><title>SuperGit 设置清单</title><g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1600" height="2280" rx="0" fill="#edf1f6" stroke="none" /><text x="64" y="88" font-size="36" fill="#253044" font-weight="650" data-max-width="1460" >软件设置与界面设置</text><text x="66" y="134" font-size="17" fill="#566477" font-weight="400" data-max-width="1460" >应用偏好即时预览并保存；Git 配置显示来源和写入范围，填写后明确保存。</text><text x="66" y="162" font-size="17" fill="#566477" font-weight="400" data-max-width="1460" >这是一份设置设计清单，除注明的现有能力外均为新增提案。</text><line x1="65" y1="216" x2="1535" y2="216" stroke="#cad3df" stroke-width="1" /><text x="66" y="246" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >常规与语言</text><text x="66" y="283" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：应用   ·   R2</text><text x="66" y="325" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >启动进入最近仓库或仓库入口；语言跟随系统 / 简体中文 / English；日期、时间与复数跟随语言环境。</text><text x="66" y="426" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >当前客户端仅中文；多语言与启动偏好为提案。</text><line x1="65" y1="482" x2="1535" y2="482" stroke="#cad3df" stroke-width="1" /><text x="66" y="512" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >外观与布局</text><text x="66" y="549" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：应用；面板位置按工作区   ·   R2</text><text x="66" y="591" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >跟随系统 / 浅色 / 深色；界面缩放 100% / 110% / 125%；舒适 / 紧凑密度；系统界面字体回退；代码字体和 11–19px 字号；恢复面板布局。</text><text x="66" y="692" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >深浅色、代码字号已有；其他选项为提案。</text><line x1="65" y1="748" x2="1535" y2="748" stroke="#cad3df" stroke-width="1" /><text x="66" y="778" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >差异与历史</text><text x="66" y="815" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：应用默认；仓库记住当前视图   ·   R2</text><text x="66" y="857" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >默认统一 / 左右 Diff；制表符 2 / 4 / 8；长行换行；显示空白；忽略空白仅影响比较；历史作者 / 时间列显示；固定直线轨道。</text><text x="66" y="958" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >统一 / 左右已支持；持久化和其他阅读选项为提案。</text><line x1="65" y1="1014" x2="1535" y2="1014" stroke="#cad3df" stroke-width="1" /><text x="66" y="1044" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >快捷键</text><text x="66" y="1081" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：应用   ·   R2</text><text x="66" y="1123" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >按命令或快捷键搜索；修改绑定；冲突检测；恢复默认；按平台显示键名。</text><text x="66" y="1224" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >固定快捷键已有；自定义与冲突编辑待实现。</text><line x1="65" y1="1280" x2="1535" y2="1280" stroke="#cad3df" stroke-width="1" /><text x="66" y="1310" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >Git 与仓库</text><text x="66" y="1347" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：只读检测 / 全局 Git / 当前仓库 Git   ·   R2</text><text x="66" y="1389" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >系统 Git 版本与路径检测；作者名称和邮箱及来源；仓库覆盖 / 继承全局；仅快进 Pull 策略说明；签名配置只读状态。</text><text x="66" y="1490" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >应用沿用系统 Git；身份设置界面与范围编辑为提案。</text><line x1="65" y1="1546" x2="1535" y2="1546" stroke="#cad3df" stroke-width="1" /><text x="66" y="1576" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >外部工具</text><text x="66" y="1613" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：应用；可选仓库覆盖   ·   R3</text><text x="66" y="1655" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >外部编辑器、Diff 工具和 Merge 工具；选择可执行文件；校验路径；恢复系统默认。</text><text x="66" y="1756" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >待实现；不在此收集或保存凭据。</text><line x1="65" y1="1812" x2="1535" y2="1812" stroke="#cad3df" stroke-width="1" /><text x="66" y="1842" font-size="26" fill="#253044" font-weight="600" data-max-width="690" >诊断与记录</text><text x="66" y="1879" font-size="15" fill="#566477" font-weight="500" data-max-width="1466" >范围：当前会话   ·   R1</text><text x="66" y="1921" font-size="19" fill="#253044" font-weight="400" data-max-width="1455" >查看任务、目标、结果和原始 Git 输出；按对象重试；网络取消后的实际结果；隐藏 URL 中敏感部分。</text><text x="66" y="2022" font-size="15" fill="#566477" font-weight="400" data-max-width="1455" >已有会话操作记录；持久化导出等不在本轮提案中。</text><text x="66" y="2214" font-size="17" fill="#253044" font-weight="500" data-max-width="1466" >语言：跟随系统 / 简体中文 / English。界面本地化；路径、分支、SHA、提交原文与原始 Git 输出保持原样。</text></g></svg>
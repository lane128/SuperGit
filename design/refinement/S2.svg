<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="控件与反馈规范"><title>控件与反馈规范</title><g font-family="Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#eeedf3" stroke="none" /><g transform="translate(64 49) scale(1.5)"><rect x="0" y="0" width="24" height="24" rx="7" fill="#69519b" stroke="none" /><path d="M9 6H6v12h3M15 6h3v12h-3" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="10" width="4" height="4" rx="1" fill="#ffffff" stroke="none" /></g><text x="116" y="78" font-size="30" fill="#2d293b" font-weight="600" data-max-width="980" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >控件与反馈规范</text><text x="64" y="121" font-size="16" fill="#625b72" font-weight="400" data-max-width="1038" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >形状表达层级：控件 5px、选中 4px、窗口 12px、弹窗 14px。</text><line x1="64" y1="148" x2="1104" y2="148" stroke="#b8afc9" stroke-width="1" /><text x="64" y="198" font-size="20" fill="#2d293b" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >同一个动作的六种状态</text><text x="64" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >默认</text><g data-component="button" data-state="normal" data-label="提交暂存内容"><rect x="64" y="258" width="158" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="78" y="279" font-size="13" fill="#2d293b" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><text x="240" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >悬停</text><g data-component="button" data-state="hover" data-label="提交暂存内容"><rect x="240" y="258" width="158" height="32" rx="5" fill="#ece6f6" stroke="#b8afc9" /><text x="254" y="279" font-size="13" fill="#2d293b" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><text x="416" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >按下</text><g data-component="button" data-state="pressed" data-label="提交暂存内容"><rect x="416" y="258" width="158" height="32" rx="5" fill="#e2d7f2" stroke="#b8afc9" /><text x="430" y="279" font-size="13" fill="#2d293b" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><text x="592" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >焦点</text><g data-component="button" data-state="focus" data-label="提交暂存内容"><rect x="588" y="254" width="166" height="40" rx="9" fill="none" stroke="#8f6cbd" stroke-width="2"/><rect x="592" y="258" width="158" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="606" y="279" font-size="13" fill="#2d293b" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><text x="768" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >运行中</text><g data-component="button" data-state="loading" data-label="正在提交"><rect x="768" y="258" width="158" height="32" rx="5" fill="#f1eff6" stroke="#f1eff6" /><circle cx="788" cy="274" r="7" fill="none" stroke="#b8afc9" stroke-width="2"/><path d="M788 267a7 7 0 0 1 7 7" fill="none" stroke="#69519b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="804" y="279" font-size="13" fill="#686176" font-weight="500" data-max-width="108" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >正在提交</text></g><text x="944" y="238" font-size="11" fill="#625b72" font-weight="500" data-max-width="160" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >不可用</text><g data-component="button" data-state="disabled" data-label="提交暂存内容"><rect x="944" y="258" width="158" height="32" rx="5" fill="#f1eff6" stroke="#b8afc9" /><text x="958" y="279" font-size="13" fill="#686176" font-weight="500" data-max-width="130" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><text x="64" y="348" font-size="20" fill="#2d293b" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >表单状态与错误位置</text><g data-component="input" data-state="normal"><rect x="64" y="380" width="320" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="76" y="401" font-size="13" fill="#2d293b" font-weight="400" data-max-width="292" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >feature/index-cache</text></g><g data-component="input" data-state="focus"><rect x="421" y="377" width="326" height="38" rx="8" fill="none" stroke="#8f6cbd" stroke-width="2"/><rect x="424" y="380" width="320" height="32" rx="5" fill="#fcfcfe" stroke="#69519b" /><text x="436" y="401" font-size="13" fill="#2d293b" font-weight="400" data-max-width="292" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >feature/index-cache</text></g><g data-component="input" data-state="invalid"><rect x="784" y="380" width="320" height="32" rx="5" fill="#fcfcfe" stroke="#a33951" /><text x="796" y="401" font-size="13" fill="#2d293b" font-weight="400" data-max-width="292" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >/missing/editor</text></g><text x="784" y="438" font-size="11" fill="#a33951" font-weight="500" data-max-width="320" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径不存在；请选择有效的应用。</text><text x="64" y="496" font-size="20" fill="#2d293b" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >提示按严重程度与对象归属</text><g data-component="notice" data-state="good"><rect x="64" y="522" width="1040" height="72" rx="6" fill="#eaf4ee" stroke="none" /><rect x="64" y="522" width="3" height="72" rx="1" fill="#286347" stroke="none" /><rect x="76" y="538" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(82 544) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#286347" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="545" font-size="13" fill="#2d293b" font-weight="600" data-max-width="972" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >已创建提交 b71f9c2</text><text x="116" y="566" font-size="11" fill="#625b72" font-weight="400" data-max-width="972" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >其余工作区修改继续保留。可以前往历史查看此提交。</text></g><g data-component="notice" data-state="warning"><rect x="64" y="610" width="1040" height="72" rx="6" fill="#faf0dd" stroke="none" /><rect x="64" y="610" width="3" height="72" rx="1" fill="#81591e" stroke="none" /><rect x="76" y="626" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(82 632) scale(0.8888888888888888)"><path d="M9 1L0 17h18zM9 6v5M9 14h.01" fill="none" stroke="#81591e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="633" font-size="13" fill="#2d293b" font-weight="600" data-max-width="972" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >core 内部有未提交文件</text><text x="116" y="654" font-size="11" fill="#625b72" font-weight="400" data-max-width="972" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >先在子模块中处理这些文件；暂存父仓库指针不会提交它们。</text></g><g data-component="notice" data-state="error"><rect x="64" y="698" width="1040" height="72" rx="6" fill="#f9e9ee" stroke="none" /><rect x="64" y="698" width="3" height="72" rx="1" fill="#a33951" stroke="none" /><rect x="76" y="714" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(82 720) scale(0.8888888888888888)"><path d="M9 1L0 17h18zM9 6v5M9 14h.01" fill="none" stroke="#a33951" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="116" y="721" font-size="13" fill="#2d293b" font-weight="600" data-max-width="972" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >stage.go 的差异读取失败</text><text x="116" y="742" font-size="11" fill="#625b72" font-weight="400" data-max-width="972" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >保留文件列表与提交草稿；重试仍针对 atlas / stage.go。</text></g><rect x="64" y="818" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="80" y="845" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >焦点与选中分开</text><text x="80" y="870" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >选中是对象归属，焦点是当前键盘位置。Tab 移动焦点，Esc 返回原对象。</text><rect x="600" y="818" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="616" y="845" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >反馈只占需要的位置</text><text x="616" y="870" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >成功反馈可短暂出现；失败留在相关对象旁，直到处理或重试成功。</text></g></svg>
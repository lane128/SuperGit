type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >诊断与记录</text><line x1="24" y1="600" x2="168" y2="600" stroke="#5b506a" stroke-width="1" /><g transform="translate(24 620) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#d0c5dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="633" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="130" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >应用偏好即时保存</text><text x="24" y="657" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="151" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 配置需明确保存</text><text x="220" y="92" font-size="20" fill="#2d293b" font-weight="600" data-max-width="650" data-type="title" font-family="Helvetica Neue,PingFang SC,sans-serif" >差异与历史</text><text x="220" y="120" font-size="13" fill="#625b72" font-weight="400" data-max-width="700" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >应用偏好 · 修改后自动保存</text><line x1="220" y1="140" x2="1000" y2="140" stroke="#e1dce9" stroke-width="1" /><text x="220" y="185" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >默认差异视图</text><text x="220" y="207" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >统一 / 左右；单个仓库记住当前视图。</text><g data-component="select"><rect x="720" y="165" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="186" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >统一</text><line x1="950" y1="173" x2="950" y2="189" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 175) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="225" x2="1000" y2="225" stroke="#e1dce9" stroke-width="1" /><text x="220" y="257" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >制表符宽度</text><text x="220" y="279" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >只影响显示，不修改文件内容。</text><g data-component="select"><rect x="720" y="237" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="258" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >4 个空格</text><line x1="950" y1="245" x2="950" y2="261" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 247) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="297" x2="1000" y2="297" stroke="#e1dce9" stroke-width="1" /><text x="220" y="329" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >长行换行</text><text x="220" y="351" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >关闭时横向滚动，保持代码列对齐。</text><rect x="940" y="311" width="44" height="24" rx="12" fill="#b8afc9" stroke="none" /><circle cx="952" cy="323" r="9" fill="#fcfcfe" stroke="none" stroke-width="1"/><text x="864" y="329" font-size="13" fill="#625b72" font-weight="400" data-max-width="60" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >关闭</text><line x1="220" y1="369" x2="1000" y2="369" stroke="#e1dce9" stroke-width="1" /><text x="220" y="401" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >空白显示</text><text x="220" y="423" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >忽略空白仅影响比较，不修改暂存补丁。</text><rect x="940" y="383" width="44" height="24" rx="12" fill="#69519b" stroke="none" /><circle cx="972" cy="395" r="9" fill="#fcfcfe" stroke="none" stroke-width="1"/><text x="864" y="401" font-size="13" fill="#625b72" font-weight="400" data-max-width="60" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >开启</text><line x1="220" y1="441" x2="1000" y2="441" stroke="#e1dce9" stroke-width="1" /><text x="220" y="473" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >历史元数据列</text><text x="220" y="495" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交说明优先，SHA 可在详情中完整复制。</text><g data-component="select"><rect x="720" y="453" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="474" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >作者与时间</text><line x1="950" y1="461" x2="950" y2="477" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 463) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="513" x2="1000" y2="513" stroke="#e1dce9" stroke-width="1" /><text x="220" y="545" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >线图轨道</text><text x="220" y="567" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >竖直主线、短折线、小圆角；过滤不改变轨道。</text><text 
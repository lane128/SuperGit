pe="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >诊断与记录</text><line x1="24" y1="600" x2="168" y2="600" stroke="#5b506a" stroke-width="1" /><g transform="translate(24 620) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#d0c5dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="633" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="130" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >应用偏好即时保存</text><text x="24" y="657" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="151" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 配置需明确保存</text><text x="220" y="92" font-size="20" fill="#2d293b" font-weight="600" data-max-width="650" data-type="title" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 与仓库</text><text x="220" y="120" font-size="13" fill="#625b72" font-weight="400" data-max-width="700" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >配置来源和写入范围始终可见</text><line x1="220" y1="140" x2="1000" y2="140" stroke="#e1dce9" stroke-width="1" /><g data-component="select"><rect x="220" y="164" width="778" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="232" y="185" font-size="13" fill="#2d293b" font-weight="400" data-max-width="733" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >当前仓库：atlas（仅写入此仓库的 Git 配置）</text><line x1="964" y1="172" x2="964" y2="188" stroke="#e1dce9" stroke-width="1" /><g transform="translate(973 174) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="220" y="223" font-size="13" fill="#2d293b" font-weight="600" data-max-width="480" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 可执行文件</text><text x="720" y="223" font-size="11" fill="#625b72" font-weight="500" data-max-width="270" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >/usr/bin/git · 已检测</text><line x1="220" y1="245" x2="998" y2="245" stroke="#e1dce9" stroke-width="1" /><text x="220" y="279" font-size="13" fill="#2d293b" font-weight="500" data-max-width="350" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交者名称</text><g data-component="input" data-state="focus"><rect x="217" y="290" width="784" height="38" rx="8" fill="none" stroke="#8f6cbd" stroke-width="2"/><rect x="220" y="293" width="778" height="32" rx="5" fill="#fcfcfe" stroke="#69519b" /><text x="232" y="314" font-size="13" fill="#2d293b" font-weight="400" data-max-width="750" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >dev</text></g><text x="220" y="357" font-size="13" fill="#2d293b" font-weight="500" data-max-width="350" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交者邮箱</text><g data-component="input" data-state="normal"><rect x="220" y="371" width="778" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="232" y="392" font-size="13" fill="#2d293b" font-weight="400" data-max-width="750" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >dev@example.invalid</text></g><text x="220" y="433" font-size="11" fill="#625b72" font-weight="400" data-max-width="775" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >来源：当前仓库覆盖全局设置</text><g data-component="notice" data-state="good"><rect x="220" y="468" width="778" height="72" rx="6" fill="#eaf4ee" stroke="none" /><rect x="220" y="468" width="3" height="72" rx="1" fill="#286347" stroke="none" /><rect x="232" y="484" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(238 490) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#286347" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="272" y="491" font-size="13" fill="#2d293b" font-weight="600" data-max-width="710" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >保存范围：atlas 的 Git 配置</text><text x="272" y="512" font-size="11" fill="#625b72" font-weight="400" data-max-width="710" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >其他仓库和全局身份不会被此次保存覆盖。</text></g><g data-component="button" data-state="normal" data-label="继承全局身份"><rect x="220" y="594" width="167" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="234" y="615" font-size="13" fill="#2d293b" font-weight="500" data-max-width="139" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >继承全局身份</text></g><g data-component="button" data-state="normal" data-label="保存到此仓库"><rect x="800" y="594" width="198" height="32" rx="5" fill="#69519b" stroke="#69519b" /><line x1="806" y1="595" x2="992" y2="595" stroke="#ffffff" stroke-width="1" opacity=".18"/><text x="814" y="615" font-size="13" fill="#ffffff" font-weight="500" data-max-width="170" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >保存到此仓库</text></g><text x="220" y="660" font-size="11" fill="#625b72" font-weight="400" data-max-width="775" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 路径与签名状态只读检测；不会在此保存凭据。</text></g></svg>
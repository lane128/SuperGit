late(24 278) scale(0.8888888888888888)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#f4effb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="52" y="292" font-size="13" fill="#f4effb" font-weight="600" data-max-width="129" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >外部工具</text><g transform="translate(24 318) scale(0.8888888888888888)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#d0c5dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="52" y="332" font-size="13" fill="#f4effb" font-weight="400" data-max-width="129" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >诊断与记录</text><line x1="24" y1="600" x2="168" y2="600" stroke="#5b506a" stroke-width="1" /><g transform="translate(24 620) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#d0c5dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="49" y="633" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="130" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >应用偏好即时保存</text><text x="24" y="657" font-size="11" fill="#d0c5dd" font-weight="400" data-max-width="151" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 配置需明确保存</text><text x="220" y="92" font-size="20" fill="#2d293b" font-weight="600" data-max-width="650" data-type="title" font-family="Helvetica Neue,PingFang SC,sans-serif" >外部工具</text><text x="220" y="120" font-size="13" fill="#625b72" font-weight="400" data-max-width="700" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >应用偏好 · 修改后自动保存</text><line x1="220" y1="140" x2="1000" y2="140" stroke="#e1dce9" stroke-width="1" /><g data-component="notice" data-state="warning"><rect x="220" y="165" width="778" height="72" rx="6" fill="#faf0dd" stroke="none" /><rect x="220" y="165" width="3" height="72" rx="1" fill="#81591e" stroke="none" /><rect x="232" y="181" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(238 187) scale(0.8888888888888888)"><path d="M9 1L0 17h18zM9 6v5M9 14h.01" fill="none" stroke="#81591e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="272" y="188" font-size="13" fill="#2d293b" font-weight="600" data-max-width="710" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >后续提案 · 工具配置尚未实现</text><text x="272" y="209" font-size="11" fill="#625b72" font-weight="400" data-max-width="710" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >选择可执行文件并验证路径，不在选择时运行外部命令。</text></g><text x="220" y="274" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >外部编辑器</text><text x="220" y="296" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >用于打开选中文件；不处理认证。</text><g data-component="select"><rect x="720" y="254" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="275" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >系统默认</text><line x1="950" y1="262" x2="950" y2="278" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 264) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="314" x2="1000" y2="314" stroke="#e1dce9" stroke-width="1" /><text x="220" y="348" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >外部 Diff 工具</text><text x="220" y="370" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >内置 Diff 仍是默认。</text><g data-component="select"><rect x="720" y="328" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="349" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >未设置</text><line x1="950" y1="336" x2="950" y2="352" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 338) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="388" x2="1000" y2="388" stroke="#e1dce9" stroke-width="1" /><text x="220" y="422" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >外部 Merge 工具</text><text x="220" y="444" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >工具生成结果后仍需检查并标记冲突已解决。</text><g data-component="select"><rect x="720" y="402" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="423" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >未设置</text><line x1="950" y1="410" x2="950" y2="426" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 412) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="462" x2="1000" y2="462" stroke="#e1dce9" stroke-width="1" /><g data-component="input" data-state="invalid"><rect x="220" y="498" width="777" height="32" rx="5" fill="#fcfcfe" stroke="#a33951" /><text x="232" y="519" font-size="13" fill="#2d293b" font-weight="400" data-max-width="749" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >/Applications/Example Editor.app</text></g><text x="221" y="550" font-size="11" fill="#a33951" font-weight="500" data-max-width="770" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径不可用：请选择存在且可执行的应用。</text><g data-component="button" data-state="normal" data-label="选择应用…"><rect x="220" y="595" width="150" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="234" y="616" font-size="13" fill="#2d293b" font-weight="500" data-max-width="122" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >选择应用…</text></g><g data-component="button" data-state="normal" data-label="验证路径"><rect x="797" y="595" width="201" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="811" y="616" font-size="13" fill="#2d293b" font-weight="500" data-max-width="173" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >验证路径</text></g></svg><text x="64" y="836" font-size="12" fill="#625b72" font-weight="600" data-max-width="1040" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >后续提案</text><text x="64" y="862" font-size="15" fill="#2d293b" font-weight="400" data-max-width="1040" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >编辑器、外部 Diff / Merge 工具分别配置并检查可执行文件。</text><text x="64" y="888" font-size="15" fill="#2d293b" font-weight="400" data-max-width="1040" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >仅选择工具不会执行命令；认证仍由系统 Git 负责。</text><text x="64" y="917" font-size="12" fill="#625b72" font-weight="400" data-max-width="1040" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >关联状态待细化：未配置 / 路径不可用 / 工具验证成功</text></g></g></svg>
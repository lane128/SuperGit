oke-linejoin="round" /></g></g><line x1="220" y1="225" x2="1000" y2="225" stroke="#e1dce9" stroke-width="1" /><text x="220" y="259" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >启动时显示</text><text x="220" y="281" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >没有可恢复仓库时进入仓库入口。</text><g data-component="select"><rect x="720" y="239" width="264" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="732" y="260" font-size="13" fill="#2d293b" font-weight="400" data-max-width="219" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >最近使用的仓库</text><line x1="950" y1="247" x2="950" y2="263" stroke="#e1dce9" stroke-width="1" /><g transform="translate(959 249) scale(0.7222222222222222)"><path d="M4 6l5 5l5-5" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><line x1="220" y1="299" x2="1000" y2="299" stroke="#e1dce9" stroke-width="1" /><text x="220" y="333" font-size="13" fill="#2d293b" font-weight="500" data-max-width="438" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >日期与时间</text><text x="220" y="355" font-size="11" fill="#625b72" font-weight="400" data-max-width="466" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >按钮、菜单、提示、错误摘要与复数形式一起切换。</text><text x="720" y="333" font-size="13" fill="#625b72" font-weight="500" data-max-width="264" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >跟随语言环境</text><line x1="220" y1="373" x2="1000" y2="373" stroke="#e1dce9" stroke-width="1" /><rect x="713" y="201" width="276" height="133" rx="6" fill="#fcfcfe" stroke="#b8afc9" /><text x="730" y="229" font-size="13" fill="#2d293b" font-weight="400" data-max-width="230" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >跟随系统</text><rect x="720" y="240" width="263" height="34" rx="4" fill="#ece6f6" stroke="none" /><text x="730" y="262" font-size="13" fill="#69519b" font-weight="600" data-max-width="230" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >✓  简体中文</text><text x="730" y="300" font-size="13" fill="#2d293b" font-weight="400" data-max-width="230" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >English</text><g data-component="notice" data-state="good"><rect x="220" y="428" width="778" height="72" rx="6" fill="#eaf4ee" stroke="none" /><rect x="220" y="428" width="3" height="72" rx="1" fill="#286347" stroke="none" /><rect x="232" y="444" width="28" height="28" rx="7" fill="#fcfcfe" stroke="none" /><g transform="translate(238 450) scale(0.8888888888888888)"><path d="M2 9l4 4L16 3" fill="none" stroke="#286347" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="272" y="451" font-size="13" fill="#2d293b" font-weight="600" data-max-width="710" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >只翻译软件界面</text><text x="272" y="472" font-size="11" fill="#625b72" font-weight="400" data-max-width="710" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >分支、路径、提交说明和原始 Git 输出保持原文。</text></g><text x="221" y="551" font-size="11" fill="#625b72" font-weight="400" data-max-width="766" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >当前客户端仅中文；此页为多语言设计提案。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="字体与对齐规范"><title>字体与对齐规范</title><g font-family="Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#eeedf3" stroke="none" /><g transform="translate(64 49) scale(1.5)"><rect x="0" y="0" width="24" height="24" rx="7" fill="#69519b" stroke="none" /><path d="M9 6H6v12h3M15 6h3v12h-3" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="10" width="4" height="4" rx="1" fill="#ffffff" stroke="none" /></g><text x="116" y="78" font-size="30" fill="#2d293b" font-weight="600" data-max-width="980" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >字体与对齐规范</text><text x="64" y="121" font-size="16" fill="#625b72" font-weight="400" data-max-width="1038" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >界面只有四级字号。代码与操作同为 13px，辅助文字才使用 11px。</text><line x1="64" y1="148" x2="1104" y2="148" stroke="#b8afc9" stroke-width="1" /><text x="64" y="199" font-size="20" fill="#2d293b" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >文字角色</text><text x="64" y="228" font-size="14" fill="#625b72" font-weight="400" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >界面：Helvetica Neue / PingFang SC；代码与 SHA：Menlo / SF Mono。</text><text x="64" y="267" font-size="13" fill="#625b72" font-weight="500" data-max-width="196" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >页面标题</text><text x="268" y="267" font-size="13" fill="#2d293b" font-weight="500" data-max-width="135" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >20 / 28</text><line x1="438" y1="267" x2="1096" y2="267" stroke="#e1dce9" stroke-width="1" /><text x="452" y="267" font-size="20" fill="#2d293b" font-weight="600" data-max-width="638" data-type="title" font-family="Helvetica Neue,PingFang SC,sans-serif" >工作区</text><text x="64" y="297" font-size="11" fill="#625b72" font-weight="400" data-max-width="1000" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >仅窗口、页面、弹窗标题</text><text x="64" y="343" font-size="13" fill="#625b72" font-weight="500" data-max-width="196" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >分组标题</text><text x="268" y="343" font-size="13" fill="#2d293b" font-weight="500" data-max-width="135" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >15 / 24</text><line x1="438" y1="343" x2="1096" y2="343" stroke="#e1dce9" stroke-width="1" /><text x="452" y="343" font-size="15" fill="#2d293b" font-weight="600" data-max-width="638" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >已暂存的内容</text><text x="64" y="373" font-size="11" fill="#625b72" font-weight="400" data-max-width="1000" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >列表分组与结构性标题</text><text x="64" y="419" font-size="13" fill="#625b72" font-weight="500" data-max-width="196" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >正文与操作</text><text x="268" y="419" font-size="13" fill="#2d293b" font-weight="500" data-max-width="135" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >13 / 20</text><line x1="438" y1="419" x2="1096" y2="419" stroke="#e1dce9" stroke-width="1" /><text x="452" y="419" font-size="13" fill="#2d293b" font-weight="400" data-max-width="638" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >选择文件，只预览差异</text><text x="64" y="449" font-size="11" fill="#625b72" font-weight="400" data-max-width="1000" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >导航、文件名、表单、按钮、代码</text><text x="64" y="495" font-size="13" fill="#625b72" font-weight="500" data-max-width="196" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >辅助信息</text><text x="268" y="495" font-size="13" fill="#2d293b" font-weight="500" data-max-width="135" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >11 / 16</text><line x1="438" y1="495" x2="1096" y2="495" stroke="#e1dce9" stroke-width="1" /><text x="452" y="495" font-size="11" fill="#2d293b" font-weight="400" data-max-width="638" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >internal/gitrepo · 2 个文件</text><text x="64" y="525" font-size="11" fill="#625b72" font-weight="400" data-max-width="1000" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >路径、来源、行号与非关键元数据</text><text x="64" y="609" font-size="20" fill="#2d293b" font-weight="600" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >同一行的固定锚点</text><text x="64" y="638" font-size="14" fill="#625b72" font-weight="400" data-max-width="1000" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >图标占 16px，文字留出 8px 间距；状态和操作拥有独立列。</text><rect x="64" y="664" width="1040" height="80" rx="6" fill="#fcfcfe" stroke="none" /><rect x="88" y="680" width="992" height="48" rx="4" fill="#ece6f6" stroke="none" /><path d="M92 688h-3v32h3" fill="none" stroke="#69519b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(104 692) scale(0.8888888888888888)"><path d="M3 1h7l4 4v12H3zM10 1v5h4" fill="none" stroke="#625b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="128" y="701" font-size="13" fill="#2d293b" font-weight="600" data-max-width="560" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >stage.go</text><text x="128" y="719" font-size="11" fill="#625b72" font-weight="400" data-max-width="560" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >internal/gitrepo</text><rect x="826" y="691" width="88" height="22" rx="4" fill="#f1eff6" stroke="none" /><text x="835" y="706" font-size="11" fill="#625b72" font-weight="500" data-max-width="71" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >已修改</text><g data-component="button" data-state="normal" data-label="暂存"><rect x="930" y="688" width="126" height="32" rx="5" fill="#fcfcfe" stroke="#b8afc9" /><text x="944" y="709" font-size="13" fill="#2d293b" font-weight="500" data-max-width="98" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >暂存</text></g><line x1="104" y1="657" x2="104" y2="758" stroke="#69519b" stroke-width="1" stroke-dasharray="3 4"/><line x1="128" y1="657" x2="128" y2="758" stroke="#69519b" stroke-width="1" stroke-dasharray="3 4"/><line x1="826" y1="657" x2="826" y2="758" stroke="#69519b" stroke-width="1" stroke-dasharray="3 4"/><line x1="930" y1="657" x2="930" y2="758" stroke="#69519b" stroke-width="1" stroke-dasharray="3 4"/><text x="104" y="778" font-size="11" fill="#625b72" font-weight="500" data-max-width="75" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >图标</text><text x="198" y="778" font-size="11" fill="#625b72" font-weight="500" data-max-width="330" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >名称 / 路径共用左边界</text><text x="826" y="778" font-size="11" fill="#625b72" font-weight="500" data-max-width="80" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >状态</text><text x="930" y="778" font-size="11" fill="#625b72" font-weight="500" data-max-width="100" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >操作</text><rect x="64" y="824" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="80" y="851" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >基线和光学校正</text><text x="80" y="876" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >同角色字体与字重不随页面改变。图标以行中心对齐，数字列右侧留齐。</text><rect x="600" y="824" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="616" y="851" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >4px 间距基准</text><text x="616" y="876" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >面板内边距 24，控件间距 8 / 12，分组间距 24。确认按钮保留完整文案。</text></g></svg>
="533" width="326" height="38" rx="8" fill="none" stroke="#8f6cbd" stroke-width="2"/><rect x="224" y="536" width="320" height="32" rx="5" fill="#fcfcfe" stroke="#69519b" /><text x="236" y="557" font-size="13" fill="#2d293b" font-weight="400" data-max-width="292" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >feat: preserve partial staging</text></g><text x="224" y="609" font-size="11" fill="#625b72" font-weight="400" data-max-width="315" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >修改即时预览；Git 数据保持原样。</text><rect x="600" y="348" width="504" height="316" rx="10" fill="#302b3a" stroke="#50465f" /><rect x="600" y="348" width="136" height="316" rx="10" fill="#25202e" stroke="none" /><g transform="translate(616 368) scale(1)"><rect x="0" y="0" width="24" height="24" rx="7" fill="#d6b7f5" stroke="none" /><path d="M9 6H6v12h3M15 6h3v12h-3" fill="none" stroke="#352442" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="10" width="4" height="4" rx="1" fill="#352442" stroke="none" /></g><text x="616" y="423" font-size="15" fill="#f5effc" font-weight="600" data-max-width="104" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >atlas</text><rect x="608" y="444" width="120" height="32" rx="4" fill="#4f3a64" stroke="none" /><text x="632" y="465" font-size="13" fill="#f5effc" font-weight="600" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >工作区</text><text x="632" y="507" font-size="13" fill="#f5effc" font-weight="400" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >历史</text><text x="632" y="547" font-size="13" fill="#f5effc" font-weight="400" data-max-width="90" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >子模块</text><text x="760" y="390" font-size="15" fill="#f0eaf6" font-weight="600" data-max-width="320" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >深色内容面</text><rect x="752" y="412" width="336" height="40" rx="4" fill="#4f3e63" stroke="none" /><path d="M756 420h-3v24h3" fill="none" stroke="#d6b7f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="768" y="438" font-size="13" fill="#f0eaf6" font-weight="500" data-max-width="303" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >b71f9c2  当前选中</text><g data-component="button" data-state="normal" data-label="提交暂存内容"><rect x="760" y="476" width="168" height="32" rx="5" fill="#d6b7f5" stroke="#d6b7f5" /><line x1="766" y1="477" x2="922" y2="477" stroke="#352442" stroke-width="1" opacity=".18"/><text x="774" y="497" font-size="13" fill="#352442" font-weight="500" data-max-width="140" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交暂存内容</text></g><g data-component="input" data-state="focus"><rect x="757" y="533" width="326" height="38" rx="8" fill="none" stroke="#d6b7f5" stroke-width="2"/><rect x="760" y="536" width="320" height="32" rx="5" fill="#302b3a" stroke="#d6b7f5" /><text x="772" y="557" font-size="13" fill="#f0eaf6" font-weight="400" data-max-width="292" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >feat: preserve partial staging</text></g><text x="760" y="609" font-size="11" fill="#c9bed6" font-weight="400" data-max-width="315" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >修改即时预览；Git 数据保持原样。</text><rect x="64" y="712" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="80" y="739" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >品牌标记来自两个边界</text><text x="80" y="764" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >成对括号与中间对象用于品牌、选中和仓库页签。它表达</text><text x="80" y="784" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >Index 与工作区的分离。</text><rect x="600" y="712" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="616" y="739" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >Git 线图保持朴素</text><text x="616" y="764" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >固定轨道、竖直主线、小圆角转轨。引用名和位置共同识别分支，不增加装饰线。</text><text x="64" y="882" font-size="13" fill="#625b72" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >危险动作使用独立红色；成功、警告、错误同时提供图标与文字。</text><text x="64" y="916" font-size="13" fill="#625b72" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >浅色与深色分别验证文字对比度。界面不借用分支色表示按钮或导航。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="1020" viewBox="0 0 1168 1020" role="img" aria-label="视觉身份与语义规范"><title>视觉身份与语义规范</title><g font-family="Helvetica Neue,PingFang SC,sans-serif"><rect x="0" y="0" width="1168" height="1020" rx="0" fill="#eeedf3" stroke="none" /><g transform="translate(64 49) scale(1.5)"><rect x="0" y="0" width="24" height="24" rx="7" fill="#69519b" stroke="none" /><path d="M9 6H6v12h3M15 6h3v12h-3" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="10" width="4" height="4" rx="1" fill="#ffffff" stroke="none" /></g><text x="116" y="78" font-size="30" fill="#2d293b" font-weight="600" data-max-width="980" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >视觉身份与语义规范</text><text x="64" y="121" font-size="16" fill="#625b72" font-weight="400" data-max-width="1038" data-type="annotation" font-family="Helvetica Neue,PingFang SC,sans-serif" >墨紫导航承载仓库上下文，明亮内容面承载代码。语义色独立于品牌色。</text><line x1="64" y1="148" x2="1104" y2="148" stroke="#b8afc9" stroke-width="1" /><rect x="64" y="190" width="152" height="62" rx="8" fill="#373143" stroke="#e1dce9" /><text x="64" y="278" font-size="13" fill="#2d293b" font-weight="500" data-max-width="150" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >导航</text><text x="64" y="300" font-size="11" fill="#625b72" font-weight="400" data-max-width="150" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >#373143</text><rect x="240" y="190" width="152" height="62" rx="8" fill="#fcfcfe" stroke="#e1dce9" /><text x="240" y="278" font-size="13" fill="#2d293b" font-weight="500" data-max-width="150" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >内容</text><text x="240" y="300" font-size="11" fill="#625b72" font-weight="400" data-max-width="150" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >#fcfcfe</text><rect x="416" y="190" width="152" height="62" rx=
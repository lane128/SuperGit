ly="Helvetica Neue,PingFang SC,sans-serif" >默认</text><text x="264" y="647" font-size="13" fill="#2d293b" font-weight="400" data-max-width="420" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >stage.go</text><text x="880" y="647" font-size="11" fill="#625b72" font-weight="500" data-max-width="32" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >M</text><line x1="88" y1="663" x2="1080" y2="663" stroke="#e1dce9" stroke-width="1" /><text x="88" y="687" font-size="11" fill="#625b72" font-weight="500" data-max-width="110" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >悬停</text><text x="264" y="687" font-size="13" fill="#2d293b" font-weight="400" data-max-width="420" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >stage.go</text><text x="880" y="687" font-size="11" fill="#625b72" font-weight="500" data-max-width="32" data-type="meta" font-family="Helvetica Neue,PingFang SC,sans-serif" >M</text><g data-component="button" data-state="hover" data-label="暂存"><rect x="940" y="667" width="128" height="32" rx="5" fill="#ece6f6" stroke="#b8afc9" /><text x="954" y="688" font-size="13" fill="#2d293b" font-weight="500" data-max-width="100" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >暂存</text></g><rect x="64" y="760" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="80" y="787" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >32px 控件与 28px 图标按钮</text><text x="80" y="812" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >图标按钮的命中区域为 28 × 28；行级操作放在 48px 文件行中，间隔不重叠。</text><rect x="600" y="760" width="504" height="102" rx="7" fill="#fcfcfe" stroke="none" /><text x="616" y="787" font-size="15" fill="#2d293b" font-weight="600" data-max-width="472" data-type="section" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交确认与执行中</text><text x="616" y="812" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >提交前只确认一次具体目标。运行 hooks 时防止重复提交，不提</text><text x="616" y="832" font-size="13" fill="#625b72" font-weight="400" data-max-width="472" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >供无法兑现的取消写入。</text><text x="64" y="927" font-size="13" fill="#625b72" font-weight="500" data-max-width="1040" data-type="body" font-family="Helvetica Neue,PingFang SC,sans-serif" >子模块列表为带状态的 72px 对象行；它不与普通文件列表混用。</text></g></svg>
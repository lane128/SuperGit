<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperGit · 设计方案对比</title>
<style>
* { box-sizing: border-box; }
:root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #192433; background: #e9edf2; }
body { margin: 0; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
svg { display: inline-block; }
.icon { width: 15px; height: 15px; flex: none; vertical-align: middle; }
.mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
.clip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.folio { max-width: 1432px; margin: 0 auto; padding: 26px 34px 32px; }
.folio-head, .sheet-head, .sheet-foot, .mast, .preview-tools { display: flex; align-items: center; justify-content: space-between; }
.mast { justify-content: flex-start; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: -.025em; }
.brand { display: inline-grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; color: #fff; background: #263e63; }
.brand .icon { width: 17px; height: 17px; }
.folio-head { min-height: 36px; }
.folio-head small, .sheet-head small, .sheet-foot { color: #485a70; }
.folio-title { margin-top: 17px; font-size: 30px; letter-spacing: -.03em; }
.folio-desc { margin-top: 6px; color: #44566b; font-size: 14px; line-height: 1.6; }
.folio-desc + .preview-tools { margin-top: 20px; }
.preview-tools { flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.preview-tools > div { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.preview-tools button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 7px; background: #dce4ed; color: #27384f; font-size: 12px; font-weight: 650; }
.preview-tools button[aria-pressed=true] { background: #233c60; color: #fff; }
.preview-tools button:focus-visible { outline: 2px solid #346bd0; outline-offset: 2px; }
.preview-scroll { overflow-x: auto; padding: 2px 2px 5px; }
.option-info { display: flex; gap: 10px 32px; flex-wrap: wrap; padding: 12px 2px; color: #43546a; font-size: 13px; line-height: 1.55; }
.option-info strong { color: #192a3e; }

.ui {
  color-scheme: dark;
  --win: #14171d; --surface: #181c23; --panel: #1b2028; --sub: #232a35; --line: #303844;
  --text: #edf1f8; --muted: #a8b6c8; --quiet: #93a6be; --nav: #111d32; --nav-line: #293951;
  --nav-select: #253d61; --btn: #2a3442; --hover: #364457; --down: #43536b;
  --blue: #9bbeff; --focus: #8cb5ff; --select: #203854; --select-hover: #294765;
  --good: #8fd8ae; --add: #193629; --bad: #f4a7b4; --del: #39252d;
  --green: #196641; --green-hover: #20734b; --green-down: #145539;
  --red: #a44451; --red-hover: #ad4755; --red-down: #903641;
  --disabled: #262d38; --disabled-text: #9ba8ba;
  --warn: #ebc486; --warn-bg: #3b3224; --orange: #f4ae73; --pink: #ee9bb8;
  --toast: #252e3c; --overlay: #090e18a8; --shadow: 0 5px 22px #070b1370;
  color: var(--text); font-size: 12px; line-height: 1.35;
}
.ui.light, .light > .ui {
  color-scheme: light;
  --win: #f0f3f7; --surface: #fff; --panel: #f7f9fc; --sub: #eaf0f7; --line: #d7e0eb;
  --text: #1b293b; --muted: #43546a; --quiet: #4e617a; --nav: #eaf0f8; --nav-line: #d8e1ed;
  --nav-select: #dce9fc; --btn: #e8edf5; --hover: #dbe5f2; --down: #d0dced;
  --blue: #2358bf; --focus: #2963d2; --select: #e2edff; --select-hover: #d4e4ff;
  --good: #17633b; --add: #e8f5ed; --bad: #9b3549; --del: #faecef;
  --green: #176840; --green-hover: #1a7245; --green-down: #125736;
  --red: #a53a47; --red-hover: #af3b4a; --red-down: #8d2d38;
  --disabled: #edf1f5; --disabled-text: #5f6d81;
  --warn: #79501b; --warn-bg: #fff1d9; --orange: #8a481d; --pink: #993c60;
  --toast: #fff; --overlay: #1d2c4560; --shadow: 0 5px 22px #15274526;
}
.ui button, .ui input, .ui textarea { color: inherit; }
.ui :is(button, input, textarea, summary, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; z-index: 2; }
.ui ::selection { color: var(--text); background: var(--select-hover); }
.ui { scrollbar-color: var(--down) var(--surface); }
.muted { color: var(--muted); }
.quiet { color: var(--quiet); }
.good { color: var(--good); }
.bad { color: var(--bad); }
.branch-color { color: var(--blue); }
.statewarn { color: var(--warn); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
  min-height: 29px; padding: 0 9px; gap: 6px; white-space: nowrap;
  border: 0; border-radius: 6px; background: var(--btn); color: var(--text);
  font-size: 12px; font-weight: 620; line-height: 1;
  transition: background-color 110ms ease, transform 120ms cubic-bezier(.23,1,.32,1);
}
.iconbtn { width: 29px; padding: 0; }
.btn:hover:not(:disabled), .btn.demo-hover { background: var(--hover); }
.btn:active:not(:disabled), .btn.demo-press { background: var(--down); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--green); color: #fff; }
.btn.primary:hover:not(:disabled), .btn.primary.demo-hover { background: var(--green-hover); }
.btn.primary:active:not(:disabled), .btn.primary.demo-press { background: var(--green-down); }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger:hover:not(:disabled), .btn.danger.demo-hover { background: var(--red-hover); }
.btn.danger:active:not(:disabled), .btn.danger.demo-press { background: var(--red-down); }
:is(.btn,.btn.primary,.btn.danger):disabled:not(.busy) { background: var(--disabled); color: var(--disabled-text); }
.btn[aria-pressed=true], .btn[aria-current=page], .btn[aria-expanded=true] { background: var(--select); color: var(--blue); }
.btn[aria-pressed=true]:hover, .btn[aria-current=page]:hover, .btn[aria-expanded=true]:hover, .btn[aria-pressed=true].demo-hover { background: var(--select-hover); }
.demo-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn .mono, .metric { font-size: 11px; font-variant-numeric: tabular-nums; }
.key { font-size: 10px; opacity: .83; margin-left: 2px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .75s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ui *, .ui *::before, .ui *::after { transition: none !important; animation: none !important; } }

.window {
  position: relative; container: window / inline-size; width: 100%; min-width: 980px; height: 624px;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
}
.window.small { width: 980px; height: 640px; margin-inline: auto; }
.window.b:not(.light) { --surface: #171a20; --panel: #1a1e26; --nav: #1a1e26; --nav-line: #303844; }
.window.c:not(.light) { --surface: #191b21; --panel: #1c202a; --nav: #171e30; }
.titlebar { min-height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 11px; background: var(--win); border-bottom: 1px solid var(--line); }
.tlights { display: flex; gap: 6px; align-items: center; padding-right: 3px; }
.tlights i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #ff605c; }
.tlights i:nth-child(2) { background: #ffbf44; }
.tlights i:nth-child(3) { background: #32c956; }
.titlebar .titleapp { display: flex; gap: 6px; align-items: center; font-weight: 720; }
.titlebar .titleapp .icon { color: var(--blue); width: 13px; height: 13px; }
.titlebar .iconbtn { min-height: 24px; width: 25px; }
.titlebar .subtitle { color: var(--quiet); margin-inline-start: auto; font-size: 11px; }
.titlebar .tinyline { height: 14px; border-left: 1px solid var(--line); }
.repo-trigger { padding-inline: 8px; min-height: 25px; }
.main-grid { min-height: 0; flex: 1; display: grid; grid-template-columns: 154px minmax(0, 1fr); }
.window.b .main-grid, .window.c .main-grid { grid-template-columns: minmax(0, 1fr); }
.rail { background: var(--nav); border-right: 1px solid var(--nav-line); padding: 13px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
.rail-top { display: flex; align-items: center; justify-content: space-between; padding: 0 3px 7px; }
.rail-top .iconbtn { min-height: 23px; width: 23px; }
.k-label { font-size: 11px; color: var(--quiet); font-weight: 620; }
.repo-row { display: flex; align-items: center; width: 100%; gap: 8px; min-height: 29px; padding: 0 6px; text-align: left; border: 0; border-radius: 5px; background: transparent; }
.repo-row[aria-current], .repo-row.active { background: var(--nav-select); font-weight: 690; }
.repo-row:hover { background: var(--nav-select); }
.repo-badge, .person { display: inline-grid; place-items: center; flex: none; width: 17px; height: 17px; border-radius: 4px; background: var(--sub); color: var(--blue); font-size: 10px; font-weight: 700; }
.repo-row small { margin-left: auto; }
.rail-end { margin-top: auto; padding: 9px 4px 3px; border-top: 1px solid var(--nav-line); }
.rail-end .btn { width: 100%; justify-content: flex-start; margin-top: 8px; }
.fetched { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 11px; color: var(--muted); }
.online { width: 6px; height: 6px; background: var(--good); border-radius: 50%; }
.work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; gap: 9px; padding: 0 10px; height: 45px; flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar .ref { color: var(--text); background: var(--sub); max-width: 216px; min-width: 105px; justify-content: flex-start; }
.toolbar .ref .icon:first-child { color: var(--blue); }
.toolbar .ref .clip { display: block; }
.toolbar .views, .toolbar .sync, .action-set { display: flex; align-items: center; gap: 5px; }
.toolbar .views { padding: 2px; background: var(--win); border-radius: 7px; }
.toolbar .views .btn { min-height: 26px; background: var(--sub); }
.toolbar .views .btn[aria-current=page] { background: var(--select); color: var(--blue); }
.toolbar .views .btn:hover { background: var(--hover); }
.toolbar .views .btn[aria-current=page]:hover { background: var(--select-hover); }
.toolbar .tile, .button-set { display: flex; align-items: center; gap: 5px; }
.toolbar .more, .toolbar .scope-toggle { display: none; }
@container window (max-width: 1080px) {
  .toolbar .soft-sync { display: none; }
  .toolbar .more { display: inline-flex; }
  .toolbar .ref { max-width: 144px; }
  .window.c .toolbar .scope-toggle { display: inline-flex; }
}
.board { display: grid; grid-template-columns: 268px minmax(0, 1fr); flex: 1; min-height: 0; min-width: 0; }
.window.b .board { grid-template-columns: 251px minmax(0, 1fr); }
.window.c .board { grid-template-columns: 242px minmax(0, 1fr) 277px; }
@container window (max-width: 1080px) {
  .window.a .board { grid-template-columns: 235px minmax(0, 1fr); }
  .window.c .board { grid-template-columns: 228px minmax(0, 1fr); }
  .window.c .board > .inspector { display: none; }
}
.files, .inspector { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.files { border-right: 1px solid var(--line); }
.inspector { border-left: 1px solid var(--line); }
.pane-title { flex: none; display: flex; align-items: center; gap: 7px; height: 39px; padding: 0 10px; border-bottom: 1px solid var(--line); font-weight: 700; }
.pane-title small { color: var(--muted); font-weight: 550; }
.pane-title .iconbtn { width: 23px; min-height: 23px; }
.file-scroll { flex: 1; overflow: auto; min-height: 0; }
.group { display: flex; align-items: center; padding: 0 8px; height: 24px; gap: 6px; color: var(--muted); background: var(--sub); font-size: 10.5px; }
.group .icon { width: 12px; height: 12px; }
.file-row { min-height: 29px; padding: 0 8px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--line); }
.file-row.active, .file-row.active:hover { background: var(--select); }
.file-row:hover { background: var(--sub); }
.file-hit { border: 0; background: transparent; padding: 0; height: 27px; flex: 1; min-width: 0; display: flex; align-items: center; text-align: left; gap: 6px; }
.file-hit .clip { font-weight: 570; }
.file-hit .kind { width: 8px; text-align: center; }
.file-row .metric { flex: none; display: flex; gap: 5px; white-space: nowrap; font-family: Menlo, monospace; }
.tick { display: inline-grid; place-items: center; width: 15px; height: 15px; flex: none; border: 1px solid var(--quiet); border-radius: 4px; padding: 0; background: var(--surface); }
.tick .icon { width: 11px; height: 11px; }
.tick.full { background: var(--green); border-color: var(--green); color: white; }
.tick.partial { border-color: var(--good); color: var(--good); background: var(--add); }
.files .composer { margin-top: auto; }
.composer { border-top: 1px solid var(--line); padding: 10px; background: var(--panel); }
.composer label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; }
.composer :is(input,textarea) { display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); padding: 7px; }
.composer input { font-weight: 650; }
.composer textarea { margin-top: 5px; min-height: 35px; resize: none; font-size: 11px; }
.composer .btn { width: 100%; margin-top: 8px; }
.composer .summary { display: flex; align-items: center; gap: 5px; line-height: 1.4; color: var(--muted); font-size: 10.5px; margin-top: 6px; }
.composer .summary .icon { width: 12px; height: 12px; color: var(--good); }
.window.b .composer { padding: 9px; }
.window.b .composer textarea { display: none; }
.scope { padding: 12px; }
.scope h3 { font-size: 13px; }
.scope-note { color: var(--muted); margin-top: 4px; font-size: 11px; }
.scope-rows { margin-top: 11px; }
.scope-row { display: flex; align-items: center; gap: 7px; min-height: 30px; border-bottom: 1px solid var(--line); }
.scope-row .icon { color: var(--good); width: 13px; height: 13px; }
.scope-row small { color: var(--muted); margin-left: auto; }
.inspector .composer { margin-top: auto; }
.scope-event { margin: 11px 12px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 11px; }
.scope-event .good { font-weight: 650; }
.inspector .scope-event .fetched { margin-top: 7px; }

.diff { position: relative; z-index: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.diff-top { display: flex; align-items: center; height: 49px; padding: 0 10px; gap: 8px; flex: none; border-bottom: 1px solid var(--line); }
.diff-top > .file-info { min-width: 0; flex: 1; }
.diff-top strong { font-size: 13px; }
.diff-top small { display: block; color: var(--muted); font-size: 10.5px; }
.diff-top .diff-stat { display: flex; gap: 6px; flex: none; font-family: Menlo, monospace; font-size: 10.5px; }
.diff-source { min-height: 29px; padding: 0 10px; display: flex; align-items: center; gap: 9px; color: var(--muted); background: var(--win); flex: none; border-bottom: 1px solid var(--line); font-size: 10.5px; }
.diff-source .btn { min-height: 21px; font-size: 10.5px; }
.diff-source .btn .icon { width: 13px; height: 13px; }
.patch { overflow: auto; min-height: 0; flex: 1; font: 11px/1.35 "SF Mono", Menlo, monospace; }
.hunk { display: flex; align-items: center; gap: 8px; height: 24px; padding-inline: 9px; color: var(--muted); background: var(--sub); white-space: nowrap; }
.line { display: grid; grid-template-columns: 23px 29px 29px 17px minmax(max-content, 1fr); min-width: max-content; min-height: 22px; align-items: center; }
.line .num { color: var(--quiet); text-align: right; padding-right: 5px; }
.line .sig { text-align: center; }
.line code { font: inherit; white-space: pre; padding: 0 7px; }
.line.plus, .side.plus { background: var(--add); }
.line.minus, .side.minus { background: var(--del); }
.plus .sig { color: var(--good); }
.minus .sig { color: var(--bad); }
.line.selected, .side.selected { background: var(--select); }
.linepick { width: 16px; height: 16px; display: grid; place-items: center; margin-left: 3px; border: 0; border-radius: 3px; background: transparent; color: var(--quiet); padding: 0; }
.linepick .icon { width: 12px; height: 12px; }
.linepick[aria-pressed=true] { background: var(--focus); color: #101a2b; }
.linepick:not([aria-pressed=true]):hover { background: var(--hover); color: var(--text); }
.split-label, .split-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split-label { min-height: 23px; background: var(--panel); color: var(--muted); }
.split-label > span { padding: 4px 8px; }
.split-label > span + span, .side + .side { border-left: 1px solid var(--line); }
.side { height: 25px; display: grid; align-items: center; grid-template-columns: 23px 28px 15px minmax(0, 1fr); }
.side .num { text-align: right; color: var(--quiet); padding-right: 4px; }
.side .sig { text-align: center; }
.side code { min-width: 0; font: inherit; white-space: pre; overflow: hidden; text-overflow: ellipsis; padding-inline: 5px; }
.side.empty { background: var(--win); }
.kw { color: var(--blue); }
.fn { color: var(--orange); }
.diff-foot { position: relative; z-index: 1; min-height: 44px; padding: 7px 10px; display: flex; gap: 8px; align-items: center; background: var(--panel); border-top: 1px solid var(--line); }
.diff-foot .selection-label { display: flex; gap: 7px; align-items: center; color: var(--muted); white-space: nowrap; }
.diff-foot strong { color: var(--text); }
.diff-foot .selection-label .icon { color: var(--blue); }
.diff-foot .btn { min-height: 28px; }
.diff-foot .action-set { margin-left: auto; }
.footerstat { justify-content: flex-end; padding: 0 11px; min-height: 26px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); background: var(--win); color: var(--quiet); font-size: 10.5px; }
.footerstat .path-status { margin-right: auto; }
.toaster { position: absolute; right: 16px; bottom: 60px; z-index: 3; width: min(318px, calc(100% - 32px)); }
.window > .toaster { bottom: 42px; }
.toast { position: relative; display: flex; align-items: center; gap: 9px; background: var(--toast); color: var(--text); box-shadow: var(--shadow); border-radius: 10px; padding: 9px; min-height: 55px; }
.toast > .icon { color: var(--good); width: 17px; height: 17px; }
.toast.error > .icon { color: var(--bad); }
.toast p { font-weight: 660; }
.toast small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.toast .btn { min-height: 24px; }
.toast .iconbtn { width: 24px; }
.toast-meter { position: absolute; bottom: 0; left: 8px; right: 8px; height: 2px; background: var(--sub); overflow: hidden; }
.toast-meter span { display: block; height: 100%; width: var(--remain, 70%); background: var(--good); }
.callout { display: flex; align-items: center; gap: 8px; padding: 9px; background: var(--warn-bg); color: var(--warn); border-radius: 7px; }
.callout p { color: var(--text); }

.history { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 286px; }
.hist-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.hist-tools { display: flex; align-items: center; gap: 8px; height: 45px; flex: none; padding: 0 10px; }
.hist-tools h3 { font-size: 14px; margin-right: auto; }
.hist-tools input, .text-field { width: 205px; max-width: 100%; height: 29px; border: 1px solid var(--line); border-radius: 6px; background: var(--win); color: var(--text); padding: 0 8px; }
.ui input::placeholder, .ui textarea::placeholder { color: var(--muted); opacity: 1; }
.hist-cols { display: grid; grid-template-columns: 72px minmax(0, 1fr) 133px 80px 68px; align-items: center; }
.hist-head { flex: none; height: 27px; color: var(--muted); background: var(--sub); font-size: 11px; border-bottom: 1px solid var(--line); }
.hist-head span:first-child { padding-left: 9px; }
.hist-log { position: relative; overflow: auto; min-height: 0; }
.hist-row { display: grid; width: 100%; height: 34px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; padding: 0; }
.hist-row[aria-current] { background: var(--select); }
.hist-row:hover { background: var(--sub); }
.hist-row[aria-current]:hover { background: var(--select-hover); }
.hist-row:focus-visible { outline-offset: -2px; }
.hist-row .ref-slot { min-width: 0; display: flex; gap: 4px; padding-right: 7px; }
.hist-subject { padding-right: 12px; }
.ref-chip { display: inline-block; border-radius: 4px; background: var(--sub); color: var(--blue); padding: 2px 5px; font-size: 10px; white-space: nowrap; }
.ref-chip.orange { color: var(--orange); }
.ref-chip.pink { color: var(--pink); }
.ref-chip.clip { display: inline-block; }
.person { border-radius: 50%; margin-right: 4px; }
.hist-row .author, .hist-row time { color: var(--muted); font-size: 11px; }
.hist-dag { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 4; }
.history .details { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
.details-inner { padding: 12px; }
.details-inner h3 { font-size: 16px; margin-bottom: 9px; overflow-wrap: anywhere; }
.details-inner p { color: var(--muted); line-height: 1.6; margin-bottom: 13px; }

@media print {

  }
  function printContent() {
    const versions = Object.keys(variants);
    const get = (id, fields = {}) => ({...defaults(), variant:id, split: id === "b", ...fields});
    const overview = `<div class="overview">${versions.map((id)=> `<figure><div class="thumb">${workbench(get(id))}</div><figcaption>
      <h2>${id.toUpperCase()} · ${variants[id].name}</h2><p class="meta">${variants[id].subtitle}</p></figcaption></figure>`).join("")}</div>
      <table class="compare-table"><caption>同一仓库、同一文件、同一选区</caption><tbody>
      <tr><th scope="row">更适合</th>${versions.map(id => `<td>${variants[id].short}</td>`).join("")}</tr>
      <tr><th scope="row">取舍</th>${versions.map(id => `<td>${variants[id].tradeoff}</td>`).join("")}</tr></tbody></table>`;
    const assumptions = '<p class="fact-strip"><strong>推荐 A 作为默认布局</strong> 仓库切换、文件浏览和提交入口都可直接访问。</p>';
    const showcase = versions.map((id, i) => sheet(i+2, `${id.toUpperCase()} · ${variants[id].name}`, variants[id].subtitle,
      workbench(get(id)), `<div class="fact-strip">${variants[id].notes.map((label,i) => i ? `<span>${label}</span>` : `<strong>${label}</strong>`).join("")}</div>`)).join("");
    const small = get("a", {small:true, en:true, staticToast:true, staticPop:true, title:"Refine line staging in the diff", description:"Keep the action next to the selected lines."});
    const narrow = sheet(5, "最小窗口与反馈", "980 × 640 · 英文、长分支名、同步计数、当前选区及上一次操作的撤销同时存在。", `
      <div class="narrow-grid">${workbench(small)}<aside class="notes">
      <h2>同步始终可见</h2><p>分支名可截断。Fetch 和显示选项收进更多菜单，Pull 与 Push 保留计数。</p>
      <h2>Toast 锚定在操作条上方</h2><p>撤销归属上一次暂存。进入撤销按钮或悬停时暂停计时。</p>
      <h2>提交只取 Index</h2><p>已暂存文件数包含部分暂存文件。选中 Diff 行后，只有暂存动作使用绿色主按钮。</p></aside></div>`);
    const logPage = sheet(6, "提交历史", "共用历史样式。提交标题保留阅读宽度，Ref 列显示主引用和 +N，完整引用在右侧详情可查。",
      workbench(get("a", {view:"history", commit:2})), '<div class="fact-strip"><strong>节点形状区分状态</strong><span>虚线 · 工作区</span><span>空环 · HEAD</span><span>环心 · 合并</span><span>菱形 · 分支点</span></div>');
    const sampling = sheet(7, "按钮、Toast 与内联提示", "无描边填充、独立焦点环、浅深色语义一致。暂存、提交与错误恢复沿用同一套组件。",
      `<div class="component-grid"><div>${componentMatrix(false)}${componentMatrix(true)}${componentShapes()}</div><div>
      <div class="sample ui"><h2>工作区反馈</h2>${toast(get("a"))}${toast(get("a"),"error")}
      <div class="callout">${icon("warn")}<div class="spacer"><strong>还有 2 个冲突文件</strong><p>解决冲突后可继续提交。</p></div>${button("查看冲突")}</div>
      <p class="caption">普通提示 5 秒，撤销 8 秒。需处理的错误保留到关闭或查看详情。</p></div>
      <div class="sample ui light"><h2>浅色 · 可恢复错误</h2>${toast(get("a"),"error")}
      <p class="caption">字段和页面的阻塞原因在相关位置保留。</p></div></div></div>`);
    const dialogs = sheet(8, "设置与弹窗", "设置在最小窗口内保留恢复入口，长名称换行。确认弹窗强调本次操作对象和影响。",
      `<div class="dialog-grid"><figure><div class="ui light">${settings(get("a",{light:true,scale:"l"}),true)}</div>
      <figcaption>设置 560 × 480 · 大字号 · 保存失败后保留重试入口</figcaption></figure>
      <div><div class="dialog-pair"><figure><div class="dialog ui">${dialogContent(get("a",{small:true}),"push",0,true)}</div>
      <figcaption>普通确认 · 长分支和远端目标允许换行</figcaption></figure>
      <figure><div class="dialog ui light">${dialogContent(get("a"),"drop",0,true)}</div><figcaption>危险确认 · 默认焦点在取消</figcaption></figure></div>
      <figure class="tag-example"><div class="dialog ui light">${dialogContent(get("a"),"tag",0,true)}</div>
      <figcaption>表单 · 用户提交后在字段旁显示校验错误</figcaption></figure></div></div>`);
    return sheet(1, "SuperGit 设计方案对比", "三种工作台布局共用一组演示数据、按钮与反馈规则。", overview, assumptions) + showcase + narrow + logPage + sampling + dialogs;
  }

  const root = document.querySelector("#preview");
  const sheets = document.querySelector("#sheets");
  if (new URLSearchParams(location.search).has("print")) {
    document.body.classList.add("printing");
    sheets.innerHTML = printContent();
    return;
  }
  window.addEventListener("beforeprint", () => { if (!sheets.children.length) sheets.innerHTML = printContent(); });
  const state = defaults();
  let notice = null;
  let previousFrame = 0;
  let frame = 0;
  let dialog = null;

  function render() {
    const info = variants[state.variant];
    root.innerHTML = `<header class="folio-head"><div class="mast">${brand()}</div><small>macOS · 交互设计稿</small></header>
    <h1 class="folio-title">SuperGit 设计方案对比</h1><p class="folio-desc">切换布局、主题和窗口大小，比较同一 Git 工作区。</p>
    <div class="preview-tools"><div role="group" aria-label="布局方案">${Object.entries(variants).map(([id,item]) =>
      `<button type="button" data-action="variant" data-id="${id}" aria-pressed="${state.variant === id}">${id.toUpperCase()} · ${item.name}</button>`).join("")}</div>
    <div role="group" aria-label="预览选项"><button type="button" data-action="narrow" aria-pressed="${state.small}">980 × 640</button>
      <button type="button" data-action="appearance" aria-pressed="${state.light}">浅色</button>
      <button type="button" data-action="language" aria-pressed="${state.en}">English</button></div></div>
    <div class="preview-scroll">${workbench(state)}</div>
    <div class="option-info"><span><strong>${info.name}</strong>　${info.subtitle}</span><span>适合 ${info.short}　·　${info.tradeoff}</span></div>`;
    paintNotice();
  }
  function paintNotice() {
    const host = root.querySelector(".toaster");
    if (!host) return;
    host.hidden = !notice;
    host.innerHTML = notice ? toast(state,notice.kind,notice.title) : "";
    if (notice) updateMeter();
  }
  function updateMeter() {
    const meter = root.querySelector(".toast-meter span");
    if (meter && notice) meter.style.setProperty("--remain", `${100 * notice.left / notice.duration}%`);
  }
  function animateNotice(time) {
    if (!notice) return;
    const item = root.querySelector(".toast");
    if (previousFrame && !document.hidden && !item?.matches(":hover, :focus-within")) notice.left -= time - previousFrame;
    previousFrame = time;
    updateMeter();
    if (notice.left > 0) frame = requestAnimationFrame(animateNotice);
    else showNotice(null);
  }
  function showNotice(kind, title, undo = null) {
    cancelAnimationFrame(frame);
    const duration = kind === "undo" ? 8000 : 5000;
    notice = kind ? {kind,title,undo,left:duration,duration} : null;
    previousFrame = 0;
    paintNotice();
    if (notice && kind !== "error") frame = requestAnimationFrame(animateNotice);
  }
  function fileSelection(id) {
    state.file = id;
    state.worktree = state.stage[id] !== "full";
    state.selected = [];
  }
  function openDialog(type, id = 0) {
    const previous = document.activeElement;
    dialog = document.createElement("dialog");
    dialog.className = `dialog ui${state.light ? " light" : ""}${type === "settings" ? " settings-shell" : type === "scope" ? " inspector-modal" : ""}`;
    dialog.setAttribute("aria-label", {settings:"SuperGit 设置",scope:"提交范围",tag:"创建标签",drop:"删除 Stash",push:"推送分支",pull:"拉取分支",details:"推送失败"}[type]);
    if (type === "settings") dialog.style.cssText = "width:min(560px, calc(100% - 24px));padding:0";
    dialog.innerHTML = type === "settings" ? settings(state) : dialogContent(state,type,id);
    dialog.addEventListener("close", () => {
      dialog.remove();
      dialog = null;
      if (previous?.isConnected) previous.focus();
    }, {once:true});
    document.body.append(dialog);
    dialog.showModal();
  }
  function closePopup(focus = false) {
    const popup = root.querySelector(".pop");
    const trigger = root.querySelector('.toolbar [aria-expanded=true], .titlebar [aria-expanded=true], .rail [aria-expanded=true]');
    if (popup) popup.hidden = true;
    trigger?.setAttribute("aria-expanded","false");
    if (focus) trigger?.focus();
  }
  function popup(button) {
    const type = button.dataset.pop, host = root.querySelector(".pop");
    const closed = host.hidden || button.getAttribute("aria-expanded") !== "true";
    closePopup();
    if (!closed) return;
    button.setAttribute("aria-expanded","true");
    host.className = `pop ${type === "repo" ? "repo-pop" : type === "ref" ? "ref-pop" : ""}`;
    if (type === "ref") host.innerHTML = `<p style="padding:4px 5px">${icon("branch")} <strong class="mono">${nameOf(state)}</strong></p>`;
    if (type === "repo") host.innerHTML = ["SuperGit","lobe-mygo","git-fixtures"].map(name => action(name,"repo","folder","","data-name="+name)).join("");
    if (type === "display") host.innerHTML = action("统一 Diff","diff-mode","","",'data-split="false"') + action("并排 Diff","diff-mode","","",'data-split="true"');
    if (type === "more") host.innerHTML = action("Fetch","fetch","refresh") + action("显示 · 统一 Diff","diff-mode","sliders","",'data-split="false"') + action("显示 · 并排 Diff","diff-mode","sliders","",'data-split="true"');
    host.hidden = false;
    host.querySelector("button")?.focus();
  }
  function commit() {
    const n = count(state);
    if (!n || !state.title.trim()) return false;
    state.stage = state.stage.map(entry => entry === "full" ? "clean" : entry === "partial" ? "none" : entry);
    state.selected = [];
    state.applied = [];
    state.ahead += 1;
    state.title = "";
    state.description = "";
    if (state.stage[state.file] === "clean") fileSelection(Math.max(0,state.stage.findIndex(entry => entry !== "clean")));
    if (dialog?.open) dialog.close();
    render();
    showNotice("success",t(state,`已提交 ${n} 个文件`,`${n} files committed`));
    return true;
  }

  document.addEventListener("click", event => {
    const control = event.target.closest("[data-action]");
    if (!control) {
      if (!event.target.closest(".pop")) closePopup();
      return;
    }
    const data = control.dataset;
    switch (data.action) {
      case "variant":
        state.variant = data.id;
        state.split = data.id === "b";
        break;
      case "narrow": state.small = !state.small; break;
      case "appearance": state.light = !state.light; state.theme = state.light ? "light" : "dark"; break;
      case "language": state.en = !state.en; break;
      case "view": state.view = data.view; break;
      case "repo":
        if (state.repo !== data.name) {
          Object.assign(state, defaults(), {repo:data.name, variant:state.variant, split:state.split, small:state.small, light:state.light, en:state.en});
          showNotice(null);
        }
        break;
      case "file": fileSelection(Number(data.file)); break;
      case "toggle-file": {
        const id = Number(data.file);
        state.stage[id] = state.stage[id] === "full" ? "none" : "full";
        if (state.file === id) fileSelection(id);
        break;
      }
      case "source": state.worktree = data.source === "work"; state.selected = []; break;
      case "diff-mode": state.split = data.split === "true"; break;
      case "line": {
        const n = Number(data.line);
        state.selected = state.selected.includes(n) ? state.selected.filter(i => i !== n) : [...state.selected,n];
        break;
      }
      case "clear": state.selected = []; break;
      case "stage": {
        const previous = { selected:state.selected.slice(), applied:state.applied.slice(), stage: state.stage[0] };
        const n = previous.selected.length;
        state.applied = [...state.applied,...state.selected];
        state.selected = [];
        state.stage[0] = "partial";
        render();
        showNotice("undo",t(state,`已暂存 ${n} 行`,`${n} lines staged`),previous);
        root.querySelector('[data-action=undo]')?.focus({preventScroll:true});
        if (event.detail) root.querySelector('[data-action=undo]')?.blur();
        return;
      }
      case "undo":
        if (notice?.undo) {
          const {selected,applied,stage} = notice.undo;
          state.file = 0; state.worktree = true;
          state.applied = applied; state.selected = selected; state.stage[0] = stage;
          showNotice(null);
          render();
          root.querySelector('[data-action=stage]')?.focus({preventScroll:true});
        }
        return;
      case "dismiss-toast": showNotice(null); return;
      case "commit": commit(); return;
      case "history-row": state.commit = Number(data.row); break;
      case "popup": popup(control); return;
      case "fetch": closePopup(true); showNotice("success",state.en ? "Fetch completed" : "Fetch 已完成"); return;
      case "push":
      case "pull":
      case "scope":
      case "settings":
      case "details": openDialog(data.action); return;
      case "tag-dialog": openDialog("tag"); return;
      case "drop-dialog": openDialog("drop",Number(data.stash)); return;
      case "drop-stash": {
        const id = Number(data.stash);
        state.stash = state.stash.filter(entry => entry !== id);
        dialog?.close();
        break;
      }
      case "confirm-sync":
        if (data.sync === "push" && state.behind) {
          dialog?.close();
          showNotice("error","推送失败");
          return;
        }
        if (data.sync === "push") state.ahead = 0;
        else state.behind = 0;
        dialog?.close();
        render();
        showNotice("success",data.sync === "push" ? "推送完成" : "拉取完成");
        return;
      case "close-dialog": dialog?.close(); return;
      case "create-tag": {
        const field = dialog.querySelector("[data-tag]");
        const error = dialog.querySelector(".field-error");
        const value = field.value.trim();
        if (!value || /[\s~^:?*\[\]\\]|\.{2}|@\{|\/$/.test(value) || log.some(([,,,,refs])=>refs.includes(value))) {
          error.textContent = !value ? "请输入标签名称。" : "标签名称无效或已存在。";
          error.hidden = false;
          field.setAttribute("aria-invalid","true");
          field.focus();
          return;
        }
        log[state.commit][4].push(value);
        dialog.close();
        break;
      }
      case "setting-page":
      case "setting-change": {
        if (data.action === "setting-page") state.prefPage = data.page;
        else if (data.key === "theme") {
          state.theme = data.value;
          state.light = data.value === "light" || data.value === "system" && matchMedia("(prefers-color-scheme:light)").matches;
        } else if (data.key === "language") state.en = data.value === "en";
        else state[data.key] = data.value;
        dialog.classList.toggle("light",state.light);
        dialog.innerHTML = settings(state);
        dialog.querySelector(data.page ? `[data-page=${data.page}]` : `[data-key=${data.key}][data-value=${data.value}]`)?.focus();
        render();
        return;
      }
      default: return;
    }
    const dataKeys = ["id","view","file","name","row","source","split","line"];
    const selector = `[data-action="${data.action}"]${dataKeys.filter(key => data[key] != null).map(key => `[data-${key}="${CSS.escape(data[key])}"]`).join("")}`;
    const restoringFocus = document.activeElement === control;
    const patchScroll = root.querySelector(".patch");
    const logScroll = root.querySelector(".hist-log");
    const offset = patchScroll ? [patchScroll.scrollLeft,patchScroll.scrollTop] : [0,0];
    const logTop = logScroll?.scrollTop || 0;
    render();
    if (!["view","file","variant"].includes(data.action)) root.querySelector(".patch")?.scrollTo(...offset);
    if (data.action === "history-row") root.querySelector(".hist-log")?.scrollTo(0,logTop);
    if (restoringFocus && !dialog?.open) root.querySelector(selector)?.focus({preventScroll:true});
  });
  document.addEventListener("input", event => {
    const field = event.target, draft = field.dataset.draft;
    if (draft) {
      state[draft] = field.value;
      const scope = field.closest(".composer");
      scope.querySelector("[data-action=commit]").disabled = !count(state) || !state.title.trim();
    }
    if (field.matches(".history-search")) {
      state.query = field.value;
      const replacement = document.createElement("template");
      replacement.innerHTML = history(state);
      const currentList = root.querySelector(".hist-log");
      currentList.replaceWith(replacement.content.querySelector(".hist-log"));
    }
    if (field.matches("[data-tag]")) {
      field.removeAttribute("aria-invalid");
      dialog.querySelector(".field-error").hidden = true;
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !dialog?.open) closePopup(true);
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && state.view === "changes" && (!dialog?.open || dialog.matches(".inspector-modal"))) {
      event.preventDefault();
      commit();
    }
    const row = event.target.closest(".hist-row");
    if (row && ["ArrowUp","ArrowDown"].includes(event.key)) {
      const next = event.key === "ArrowDown" ? row.nextElementSibling : row.previousElementSibling;
      if (next?.matches(".hist-row")) {
        event.preventDefault();
        next.focus();
        next.click();
      }
    }
  });
  render();
})();
</script>
</body>
</html>

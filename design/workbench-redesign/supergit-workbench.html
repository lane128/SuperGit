<style>
  #supergit-workbench {
    color-scheme: light dark;
    --sg-canvas: light-dark(#f3f5f8, #151c28);
    --sg-surface: light-dark(#fff, #1a2331);
    --sg-panel: light-dark(#f9fafc, #171f2c);
    --sg-subtle: light-dark(#edf1f6, #263143);
    --sg-line: light-dark(#e0e5ed, #313d50);
    --sg-text: light-dark(#1b2535, #e8edf5);
    --sg-subtext: light-dark(#596579, #a6b3c7);
    --sg-faint: light-dark(#68768c, #98a7bd);
    --sg-blue: light-dark(#2359cd, #a8c1ff);
    --sg-focus: light-dark(#2d64df, #8eacff);
    --sg-button: light-dark(#245acb, #3968d6);
    --sg-on-button: #fff;
    --sg-selected: light-dark(#eaf0ff, #233752);
    --sg-plus: light-dark(#17603d, #9adab4);
    --sg-plus-bg: light-dark(#eaf6ee, #20392f);
    --sg-minus: light-dark(#9f3c44, #f3abb1);
    --sg-minus-bg: light-dark(#fceef0, #422930);
    --sg-warning: light-dark(#865615, #f2ca89);
    --sg-warning-bg: light-dark(#fff2db, #3e3324);
    --sg-purple: light-dark(#7155a5, #c7aef9);
    --sg-teal: light-dark(#187c7c, #73d0c5);
    --sg-sidebar: light-dark(#202b3d, #121924);
    --sg-sidebar-line: light-dark(#344158, #2b374b);
    --sg-sidebar-text: #e4ebf8;
    --sg-sidebar-muted: #a9b8cf;
    --sg-sidebar-active: light-dark(#354b73, #293e63);
    --sg-radius: 12px;
    --sg-mono: "SFMono-Regular", Menlo, Consolas, monospace;
    container-type: inline-size;
    color: var(--sg-text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #supergit-workbench[data-appearance="light"] { color-scheme: light; }
  #supergit-workbench[data-appearance="dark"] { color-scheme: dark; }
  #supergit-workbench *, #supergit-workbench *::before, #supergit-workbench *::after { box-sizing: border-box; }
  #supergit-workbench [hidden] { display: none !important; }
  #supergit-workbench button, #supergit-workbench input, #supergit-workbench textarea { font: inherit; }
  #supergit-workbench button { color: inherit; }
  #supergit-workbench button:disabled { cursor: default; }
  #supergit-workbench :is(button, input, textarea):focus-visible { outline: 2px solid var(--sg-focus); outline-offset: 2px; }
  #supergit-workbench p, #supergit-workbench h2, #supergit-workbench h3 { margin: 0; }
  #supergit-workbench svg.lucide { width: 15px; height: 15px; flex: none; stroke-width: 1.7; vertical-align: middle; }
  #supergit-workbench .mono { font-family: var(--sg-mono); font-size: 11px; }
  #supergit-workbench .muted { color: var(--sg-subtext); }
  #supergit-workbench .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #supergit-workbench .window {
    display: grid;
    grid-template-columns: 166px minmax(0, 1fr);
    min-width: 0;
    border: 1px solid var(--sg-line);
    border-radius: var(--sg-radius);
    background: var(--sg-surface);
  }
  #supergit-workbench .rail {
    display: flex; flex-direction: column; min-width: 0;
    border-radius: calc(var(--sg-radius) - 1px) 0 0 calc(var(--sg-radius) - 1px);
    background: var(--sg-sidebar); color: var(--sg-sidebar-text);
  }
  #supergit-workbench .traffic {
    height: 53px; display: flex; gap: 7px; align-items: center; padding-inline: 17px;
  }
  #supergit-workbench .traffic span { width: 11px; height: 11px; border-radius: 50%; background: #fc635e; }
  #supergit-workbench .traffic span:nth-child(2) { background: #f4bd4f; }
  #supergit-workbench .traffic span:nth-child(3) { background: #35c75a; }
  #supergit-workbench .identity { display: flex; align-items: center; gap: 9px; padding: 13px 12px 15px; }
  #supergit-workbench .identity-mark {
    display: grid; place-items: center; width: 31px; height: 31px; flex: none;
    color: #e3ecff; background: #3e5884; border-radius: 8px;
  }
  #supergit-workbench .identity-mark svg { width: 17px; height: 17px; }
  #supergit-workbench .identity strong { display: block; font-size: 14px; letter-spacing: .01em; }
  #supergit-workbench .identity small { display: block; margin-top: 2px; color: var(--sg-sidebar-muted); }
  #supergit-workbench .rail-set { min-width: 0; padding: 10px 8px; }
  #supergit-workbench .rail-set + .rail-set { border-top: 1px solid var(--sg-sidebar-line); }
  #supergit-workbench .rail-heading {
    display: block; padding: 0 6px 6px; color: var(--sg-sidebar-muted);
    font-size: 11px; font-weight: 600;
  }
  #supergit-workbench .rail-item {
    width: 100%; min-height: 30px; display: flex; align-items: center; gap: 7px;
    border: 0; background: transparent; padding: 4px 6px; text-align: left; border-radius: 5px;
  }
  #supergit-workbench .rail-item:hover { background: var(--sg-sidebar-line); }
  #supergit-workbench .rail-item[aria-current="page"], #supergit-workbench .rail-item[aria-pressed="true"] {
    background: var(--sg-sidebar-active); color: #fff;
  }
  #supergit-workbench .rail-item .counter {
    margin-left: auto; color: var(--sg-sidebar-text); background: #4b6288;
    padding: 0 5px; border-radius: 4px; font-size: 11px; font-variant-numeric: tabular-nums;
  }
  #supergit-workbench .rail-item .ref-label { font-family: var(--sg-mono); font-size: 11px; }
  #supergit-workbench .rail-item .branch-now { margin-left: auto; color: #a7c2ff; }
  #supergit-workbench .rail-end { margin-top: auto; padding: 8px; }
  #supergit-workbench .rail-end .rail-item { color: var(--sg-sidebar-muted); }
  #supergit-workbench .app { display: grid; grid-template-rows: auto auto minmax(540px, 1fr) auto; min-width: 0; }
  #supergit-workbench .toolbar {
    min-height: 53px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 18px; border-bottom: 1px solid var(--sg-line);
    background: var(--sg-canvas); border-top-right-radius: calc(var(--sg-radius) - 1px);
  }
  #supergit-workbench .branch-label { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
  #supergit-workbench .branch-label svg { color: var(--sg-blue); }
  #supergit-workbench .branch-name { font-family: var(--sg-mono); font-size: 12px; }
  #supergit-workbench .sync-buttons, #supergit-workbench .inline { display: flex; align-items: center; gap: 6px; }
  #supergit-workbench .control {
    display: inline-flex; align-items: center; justify-content: center; min-height: 29px; gap: 5px;
    padding: 3px 8px; border: 1px solid var(--sg-line); border-radius: 5px;
    background: var(--sg-surface); font-size: 12px; font-weight: 550; line-height: 1.25; white-space: nowrap;
  }
  #supergit-workbench .control:hover:not(:disabled) { border-color: var(--sg-faint); }
  #supergit-workbench .control.primary { color: var(--sg-on-button); background: var(--sg-button); border-color: var(--sg-button); }
  #supergit-workbench .control.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--sg-button), black 10%); }
  #supergit-workbench .control:disabled { color: var(--sg-faint); background: var(--sg-subtle); border-color: var(--sg-line); }
  #supergit-workbench .push-count { color: var(--sg-blue); font-variant-numeric: tabular-nums; }
  #supergit-workbench .pagebar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; min-height: 73px; border-bottom: 1px solid var(--sg-line);
  }
  #supergit-workbench .pagebar h2 { letter-spacing: -.025em; font-size: 23px; line-height: 1.17; font-weight: 660; }
  #supergit-workbench .pagebar p { font-size: 12px; margin-top: 3px; color: var(--sg-subtext); }
  #supergit-workbench .searchbox {
    display: flex; align-items: center; gap: 7px; padding: 3px 9px; min-height: 31px;
    border: 1px solid var(--sg-line); border-radius: 6px; background: var(--sg-panel); color: var(--sg-subtext);
  }
  #supergit-workbench .searchbox input { border: 0; background: transparent; color: var(--sg-text); width: min(19ch, 100%); }
  #supergit-workbench .searchbox input::placeholder, #supergit-workbench .compose :is(input, textarea)::placeholder { color: var(--sg-faint); }
  #supergit-workbench .workspace { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-width: 0; }
  #supergit-workbench .changes {
    display: flex; flex-direction: column; min-width: 0; background: var(--sg-panel); border-right: 1px solid var(--sg-line);
  }
  #supergit-workbench .group-heading {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px 3px;
    font-size: 11px; letter-spacing: .015em; color: var(--sg-subtext);
  }
  #supergit-workbench .group-heading strong { font-weight: 640; }
  #supergit-workbench .group-heading span { font-variant-numeric: tabular-nums; }
  #supergit-workbench .group-heading .index-color { color: var(--sg-plus); }
  #supergit-workbench .file-entry {
    display: grid; grid-template-columns: minmax(0, 1fr) 29px; align-items: center;
    position: relative; margin: 1px 6px; border-radius: 5px;
  }
  #supergit-workbench .file-entry:hover { background: var(--sg-subtle); }
  #supergit-workbench .file-entry.is-current { background: var(--sg-selected); box-shadow: inset 2px 0 var(--sg-focus); }
  #supergit-workbench .file-hit {
    min-width: 0; width: 100%; display: flex; align-items: center; gap: 7px;
    min-height: 39px; padding: 3px 5px 3px 8px; text-align: left; background: none; border: 0;
  }
  #supergit-workbench .file-copy { display: grid; min-width: 0; }
  #supergit-workbench .filename { font-size: 12px; font-weight: 610; }
  #supergit-workbench .file-path { display: block; font-size: 11px; color: var(--sg-subtext); }
  #supergit-workbench .file-status {
    width: 17px; height: 17px; border-radius: 3px; background: var(--sg-warning-bg); color: var(--sg-warning);
    font: 600 11px/17px var(--sg-mono); text-align: center; flex: none;
  }
  #supergit-workbench .file-status.add { color: var(--sg-plus); background: var(--sg-plus-bg); }
  #supergit-workbench .file-status.unknown { color: var(--sg-subtext); background: var(--sg-subtle); }
  #supergit-workbench .file-action {
    width: 25px; min-height: 25px; display: grid; place-items: center; padding: 0;
    border: 1px solid transparent; border-radius: 4px; background: transparent;
    font-size: 15px; line-height: 1;
  }
  #supergit-workbench .file-action:hover { border-color: var(--sg-line); background: var(--sg-surface); }
  #supergit-workbench .none { display: block; padding: 4px 11px 6px; color: var(--sg-faint); font-size: 11px; }
  #supergit-workbench .compose {
    margin-top: auto; border-top: 1px solid var(--sg-line); background: var(--sg-surface); padding: 11px 10px 12px;
  }
  #supergit-workbench .compose h3 { margin-bottom: 8px; font-size: 13px; font-weight: 660; }
  #supergit-workbench .compose-fields { display: grid; margin-bottom: 8px; }
  #supergit-workbench .compose :is(input, textarea) {
    display: block; width: 100%; min-height: 29px; padding: 5px 7px; font-size: 12px;
    color: var(--sg-text); background: var(--sg-panel); border: 1px solid var(--sg-line);
  }
  #supergit-workbench .compose input { border-radius: 5px 5px 0 0; }
  #supergit-workbench .compose textarea { border-top: 0; border-radius: 0 0 5px 5px; min-height: 44px; resize: vertical; }
  #supergit-workbench .compose .control { width: 100%; justify-content: space-between; min-height: 31px; }
  #supergit-workbench kbd { font: 11px/1.3 var(--sg-mono); white-space: nowrap; }
  #supergit-workbench .compose p { margin-top: 6px; color: var(--sg-subtext); font-size: 11px; }
  #supergit-workbench .viewer { display: flex; flex-direction: column; min-width: 0; }
  #supergit-workbench .diff-header {
    display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 10px 12px 10px 15px; border-bottom: 1px solid var(--sg-line);
  }
  #supergit-workbench .diff-header h3 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 660; }
  #supergit-workbench .diff-header h3 svg { color: var(--sg-subtext); }
  #supergit-workbench .diff-heading { min-width: 0; }
  #supergit-workbench .diff-heading p { margin-top: 2px; }
  #supergit-workbench .diff-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  #supergit-workbench .stats { display: inline-flex; gap: 5px; white-space: nowrap; font: 600 11px/1.4 var(--sg-mono); }
  #supergit-workbench .plus { color: var(--sg-plus); }
  #supergit-workbench .minus { color: var(--sg-minus); }
  #supergit-workbench .segment {
    display: inline-flex; gap: 1px; align-items: center; padding: 2px;
    background: var(--sg-subtle); border: 1px solid var(--sg-line); border-radius: 6px;
  }
  #supergit-workbench .segment button {
    min-height: 22px; border: 1px solid transparent; border-radius: 4px; padding: 1px 6px;
    background: transparent; font-size: 11px; white-space: nowrap;
  }
  #supergit-workbench .segment button[aria-pressed="true"] {
    background: var(--sg-surface); border-color: var(--sg-line); font-weight: 620;
  }
  #supergit-workbench .patch { min-width: 0; }
  #supergit-workbench .patch + .patch { border-top: 1px solid var(--sg-line); }
  #supergit-workbench .hunk-head {
    display: flex; justify-content: space-between; align-items: center; gap: 5px;
    padding: 3px 10px 3px 13px; min-height: 34px; background: var(--sg-canvas);
    border-bottom: 1px solid var(--sg-line);
  }
  #supergit-workbench .hunk-head .position { color: var(--sg-blue); }
  #supergit-workbench .hunk-head .scope { color: var(--sg-subtext); }
  #supergit-workbench .hunk-head .control { min-height: 24px; padding-block: 2px; font-size: 11px; }
  #supergit-workbench .code-row {
    display: grid; grid-template-columns: 29px 29px 20px minmax(0, 1fr);
    min-height: 23px; width: 100%; align-items: stretch; border: 0; border-radius: 0;
    padding: 0; text-align: left; background: transparent;
    font: 11.5px/1.55 var(--sg-mono);
  }
  #supergit-workbench .code-row > * { padding-block: 2px; }
  #supergit-workbench .code-row .num { text-align: right; padding-inline: 3px; color: var(--sg-faint); font-size: 11px; }
  #supergit-workbench .code-row .sign { text-align: center; border-left: 1px solid var(--sg-line); }
  #supergit-workbench .code-row .code { min-width: 0; padding-inline: 3px 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #supergit-workbench .code-row.addition { background: var(--sg-plus-bg); }
  #supergit-workbench .code-row.deletion { background: var(--sg-minus-bg); }
  #supergit-workbench .code-row.addition :is(.num, .sign) { color: var(--sg-plus); }
  #supergit-workbench .code-row.deletion :is(.num, .sign) { color: var(--sg-minus); }
  #supergit-workbench button.code-row:hover { box-shadow: inset 2px 0 var(--sg-focus); }
  #supergit-workbench button.code-row[aria-pressed="true"] { background: var(--sg-selected); box-shadow: inset 2px 0 var(--sg-focus); }
  #supergit-workbench .token-key { color: var(--sg-purple); }
  #supergit-workbench .token-string { color: var(--sg-plus); }
  #supergit-workbench .token-call { color: var(--sg-blue); }
  #supergit-workbench .split-head, #supergit-workbench .split-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #supergit-workbench .split-head span { background: var(--sg-panel); padding: 4px 9px; border-bottom: 1px solid var(--sg-line); }
  #supergit-workbench .split-row > :first-child, #supergit-workbench .split-head > :first-child { border-right: 1px solid var(--sg-line); }
  #supergit-workbench .split-row .code-row { grid-template-columns: 28px 16px minmax(0, 1fr); }
  #supergit-workbench .split-row .spacer { background: var(--sg-panel); }
  #supergit-workbench .selection-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 7px; flex-wrap: wrap;
    margin-top: auto; min-height: 37px; padding: 5px 11px 5px 15px;
    border-top: 1px solid var(--sg-line); color: var(--sg-subtext); font-size: 11px;
  }
  #supergit-workbench .empty { padding: 23px 15px; color: var(--sg-subtext); }
  #supergit-workbench .history { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 42%); min-width: 0; }
  #supergit-workbench .timeline { min-width: 0; border-right: 1px solid var(--sg-line); background: var(--sg-panel); }
  #supergit-workbench .commit-list { position: relative; min-width: 0; }
  #supergit-workbench .commit-head, #supergit-workbench .commit-row {
    display: grid; grid-template-columns: 58px minmax(0, 1fr) 69px; gap: 2px; align-items: center;
    width: 100%; padding: 0 8px 0 0;
  }
  #supergit-workbench .commit-head {
    height: 31px; background: var(--sg-canvas); color: var(--sg-subtext);
    border-bottom: 1px solid var(--sg-line); font-size: 11px;
  }
  #supergit-workbench .commit-head > :first-child { padding-left: 9px; }
  #supergit-workbench .commit-row {
    height: 34px; border: 0; border-bottom: 1px solid var(--sg-line); text-align: left; background: transparent;
  }
  #supergit-workbench .commit-row:hover { background: var(--sg-subtle); }
  #supergit-workbench .commit-row[aria-pressed="true"] { background: var(--sg-selected); box-shadow: inset 2px 0 var(--sg-focus); }
  #supergit-workbench .commit-title-line { display: flex; align-items: center; min-width: 0; gap: 5px; }
  #supergit-workbench .commit-title-line > span:first-child { min-width: 0; font-size: 12px; }
  #supergit-workbench .commit-row[aria-pressed="true"] .commit-title-line > span:first-child { font-weight: 650; }
  #supergit-workbench .ref-badge {
    display: inline-flex; align-items: center; padding: 0 4px; min-height: 17px; max-width: 135px;
    color: var(--sg-blue); background: var(--sg-selected); border: 1px solid color-mix(in srgb, var(--sg-blue), transparent 78%);
    border-radius: 4px; font: 11px/1.25 var(--sg-mono);
  }
  #supergit-workbench .ref-badge.alt { color: var(--sg-purple); background: var(--sg-subtle); border-color: var(--sg-line); }
  #supergit-workbench .dag { position: absolute; top: 0; left: 0; pointer-events: none; }
  #supergit-workbench .dag .lane-0 { color: var(--sg-blue); }
  #supergit-workbench .dag .lane-1 { color: var(--sg-teal); }
  #supergit-workbench .dag .lane-2 { color: var(--sg-purple); }
  #supergit-workbench .summary { padding: 16px 14px; }
  #supergit-workbench .summary h3 { font-size: 16px; font-weight: 660; overflow-wrap: anywhere; }
  #supergit-workbench .summary .refs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  #supergit-workbench .summary .description { color: var(--sg-subtext); margin-top: 11px; line-height: 1.55; }
  #supergit-workbench .summary dl { display: grid; grid-template-columns: 49px minmax(0, 1fr); gap: 6px; margin: 13px 0; font-size: 12px; }
  #supergit-workbench .summary dt { color: var(--sg-subtext); }
  #supergit-workbench .summary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  #supergit-workbench .text-action { background: none; border: 0; padding: 0; color: var(--sg-blue); text-decoration: underline; }
  #supergit-workbench .history-files { border-top: 1px solid var(--sg-line); padding: 0 10px 8px; }
  #supergit-workbench .history-files .group-heading { padding: 8px 4px; }
  #supergit-workbench .history-files .file-hit { min-height: 32px; border-radius: 4px; }
  #supergit-workbench .history-files .file-hit[aria-pressed="true"] { background: var(--sg-selected); }
  #supergit-workbench .history-patch .hunk-head { border-top: 1px solid var(--sg-line); }
  #supergit-workbench .statusbar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap;
    min-height: 31px; border-top: 1px solid var(--sg-line); background: var(--sg-canvas);
    border-bottom-right-radius: calc(var(--sg-radius) - 1px); padding: 4px 12px;
    font-size: 11px; color: var(--sg-subtext);
  }
  #supergit-workbench .statusbar .remote-ref { min-width: 0; overflow-wrap: anywhere; }
  #supergit-workbench .statusbar svg { width: 13px; height: 13px; }
  #supergit-workbench .confirm {
    max-width: min(380px, calc(100% - 24px)); padding: 17px; color: var(--sg-text);
    background: var(--sg-surface); border: 1px solid var(--sg-line); border-radius: 9px;
  }
  #supergit-workbench .confirm::backdrop { background: rgb(13 21 36 / .46); }
  #supergit-workbench .confirm h3 { margin-bottom: 7px; font-size: 16px; }
  #supergit-workbench .confirm p { margin-bottom: 14px; color: var(--sg-subtext); overflow-wrap: anywhere; }
  #supergit-workbench .confirm-actions { display: flex; gap: 6px; justify-content: flex-end; }
  @container (max-width: 810px) {
    #supergit-workbench .window { grid-template-columns: 139px minmax(0, 1fr); }
    #supergit-workbench .workspace { grid-template-columns: 176px minmax(0, 1fr); }
    #supergit-workbench .history { grid-template-columns: minmax(0, 1fr) minmax(225px, 42%); }
    #supergit-workbench .commit-title-line .ref-badge { max-width: 54px; }
    #supergit-workbench .diff-header { padding-inline: 9px; }
  }
  @container (max-width: 690px) {
    #supergit-workbench .window { grid-template-columns: minmax(0, 1fr); }
    #supergit-workbench .rail { flex-direction: row; align-items: center; border-radius: 11px 11px 0 0; }
    #supergit-workbench :is(.traffic, .rail-refs, .identity small, .rail-heading) { display: none; }
    #supergit-workbench .identity { padding: 7px; }
    #supergit-workbench .identity-mark { width: 24px; height: 24px; border-radius: 5px; }
    #supergit-workbench .identity-mark svg { width: 14px; height: 14px; }
    #supergit-workbench .identity strong { font-size: 12px; }
    #supergit-workbench .nav-set { display: flex; padding: 4px 0; gap: 3px; }
    #supergit-workbench .nav-set .rail-item { width: auto; white-space: nowrap; }

<script>
(() => {
  const root = document.getElementById("supergit-workbench");
  const find = (selector) => root.querySelector(selector);
  const all = (selector) => Array.from(root.querySelectorAll(selector));
  const branch = "feature/diff-preview";
  const upstream = "origin/" + branch;
  const groupNames = { index: "已暂存", work: "未暂存", new: "未跟踪" };
  const escape = (value) => String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
  const icon = (name) => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
  const icons = () => globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

  function hunk(start, label, lines) {
    return {
      start, label,
      lines: lines.map(([kind, code]) => ({ kind, code, staged: false, committed: false }))
    };
  }

  const patchFile = {
    id: "diff", name: "diff_view.go", dir: "internal/lobedesk", type: "M",
    hunks: [
      hunk(42, "renderPatch", [
        [" ", "func renderPatch(c *ui.Context, patch Patch) {"],
        [" ", "\tmode := patch.DisplayMode"],
        ["-", "\trows := unifiedRows(patch)"],
        ["-", "\tdrawRows(c, rows)"],
        ["+", "\tif mode == DiffSplit {"],
        ["+", "\t\tdrawSplit(c, splitRows(patch))"],
        ["+", "\t\treturn"],
        ["+", "\t}"],
        ["+", "\tdrawRows(c, unifiedRows(patch))"],
        [" ", "}"],
        [" ", ""]
      ]),
      hunk(87, "patchToolbar", [
        [" ", "func patchToolbar(c *ui.Context, state *DiffState) {"],
        [" ", "\tshowPath(c, state.Path)"],
        ["-", "\tdisplay.Text(c, modeLabel(state.Mode))"],
        ["+", "\tmode := diffModeControl(c, state.Mode)"],
        ["+", "\tstate.SetMode(mode)"],
        [" ", "}"]
      ])
    ]
  };
  const files = [
    { id: "layout", name: "workbench_layout.go", dir: "internal/lobedesk", type: "M", hunks: [
      hunk(61, "detailWidth", [
        [" ", "func detailWidth(window float32) float32 {"],
        ["-", "\treturn max(320, window - 590)"],
        ["+", "\treturn max(400, window - 390)"],
        [" ", "}"]
      ])
    ] },
    { id: "strings", name: "strings_zh.go", dir: "internal/lobedesk", type: "A", hunks: [
      hunk(0, "", [
        ["+", "package lobedesk"], ["+", ""],
        ["+", 'const stageSelected = "暂存所选行"'],
        ["+", 'const compareSplit = "并排"']
      ])
    ] },
    patchFile,
    { id: "theme", name: "theme.go", dir: "internal/lobedesk", type: "M", hunks: [
      hunk(28, "workbenchTheme", [
        [" ", "func workbenchTheme(dark bool) Palette {"],
        ["-", "\treturn neutralPalette(dark)"],
        ["+", "\treturn slatePalette(dark)"],
        [" ", "}"]
      ])
    ] },
    { id: "readme", name: "README.md", dir: "", type: "M", hunks: [
      hunk(12, "运行", [
        [" ", "### 工作区"],
        ["-", "点击文件查看改动。"],
        ["+", "点击文件查看改动，可在统一与并排视图之间切换。"],
        [" ", ""]
      ])
    ] },
    { id: "review", name: "diff-review.md", dir: "docs", type: "?", hunks: [
      hunk(0, "", [
        ["+", "# Diff 验收"],
        ["+", ""],
        ["+", "- 统一与并排视图切换"],
        ["+", "- 核对已暂存和未暂存的行号"]
      ])
    ] }
  ];
  for (const file of files.slice(0, 2)) {
    for (const { lines } of file.hunks) {
      for (const line of lines) line.staged = line.kind !== " ";
    }
  }

  const initialHistory = [
    ["d19ea75","feat: add split diff preview","Adam","11-16 14:32",0,["ac7d492"],[branch],"拆分 Diff 视图。统一和并排模式使用同一份补丁数据，切换视图时保留文件选择。",["diff","layout"]],
    ["ac7d492","refactor: separate patch rendering","Adam","11-16 11:18",0,["7fae812"],[],"单独构建补丁行，简化工作区和历史详情的渲染逻辑。",["diff"]],
    ["983b0f1","Merge branch 'fix/remote-status'","Mina","11-16 10:02",1,["55f48b9","c63d3a0"],["main","origin/main"],"合并远端状态更新，增加读取失败后的重试入口。",["strings"]],
    ["7fae812","feat: keep selection across refresh","Adam","11-15 19:46",0,["e831b5c"],[upstream],"刷新后按路径和暂存分组恢复选中的文件。",["diff"]],
    ["55f48b9","docs: document commit shortcuts","Mina","11-15 17:58",1,["e831b5c"],[],"补充提交和刷新快捷键。",["readme"]],
    ["c63d3a0","fix: refresh remote status after fetch","Mina","11-15 15:41",2,["e831b5c"],[],"Fetch 完成后刷新远端跟踪引用和同步计数。",["strings"]],
    ["e831b5c","build: prepare v0.4.0","Adam","11-14 18:23",0,["9f24c7b"],["v0.4.0"],"准备 v0.4.0 开发预览构建。",["readme"]],
    ["9f24c7b","fix: preserve keyboard focus in diff","Adam","11-14 15:06",0,["b05d3fa"],[],"文件切换后恢复 Diff 键盘焦点。",["diff"]],
    ["b05d3fa","Merge branch 'docs/shortcuts'","Mina","11-13 17:55",0,["1c4d76b","523de8a"],[],"合并工作台快捷键说明。",["readme"]],
    ["1c4d76b","fix: restore pane widths on launch","Adam","11-13 16:10",0,["8184f2d"],[],"启动时读取已保存的工作台分栏宽度。",["layout"]],
    ["523de8a","docs: describe staging by hunk","Mina","11-13 15:54",1,["8184f2d"],[],"补充片段暂存的操作步骤。",["readme"]],
    ["8184f2d","feat: add workspace file groups","Adam","11-12 13:27",0,[],[],"按照已暂存、未暂存、未跟踪显示改动。",["layout"]]
  ];

  function clonePatch(file) {
    return {
      ...file,
      hunks: file.hunks.map((section) => ({
        ...section, lines: section.lines.map((line) => ({ ...line, staged: false, committed: false }))
      }))
    };
  }

  const history = initialHistory.map(([hash, subject, author, date, lane, parents, refs, description, ids]) => ({
    hash, subject, author, date, lane, parents, refs, description,
    files: ids.map((id) => clonePatch(files.find((file) => file.id === id)))
  }));
  const state = {
    view: "workspace", file: "diff", group: "work", split: false, selected: new Set(),
    commit: history[0].hash, historyFile: "", ref: "", ahead: 2, created: 0
  };

  const lineKey = (section, line) => section + ":" + line;
  const isChanged = (line) => line.kind !== " " && !line.committed;

  function groupOf(file, line) {
    if (!isChanged(line)) return "";
    if (line.staged) return "index";
    return file.type === "?" && !file.hunks.some(({ lines }) => lines.some((entry) => entry.committed)) ? "new" : "work";
  }

  function projections(file, group) {
    let previousBaseDelta = 0;
    let previousIndexDelta = 0;
    let previousWorkDelta = 0;
    return file.hunks.map((section, sectionIndex) => {
      const offset = Math.max(1, section.start);
      let old = offset + (group === "index" ? previousBaseDelta : previousIndexDelta);
      let next = offset + (group === "index" ? previousIndexDelta : previousWorkDelta);
      const rows = [];
      for (const [index, line] of section.lines.entries()) {
        const addition = line.kind === "+";
        const deletion = line.kind === "-";
        const inBase = addition ? line.committed : !(deletion && line.committed);
        const inIndex = addition ? line.committed || line.staged : !(deletion && (line.staged || line.committed));
        const inWork = !deletion;
        previousBaseDelta += Number(inBase) - Number(!addition);
        previousIndexDelta += Number(inIndex) - Number(!addition);
        previousWorkDelta += Number(inWork) - Number(!addition);
        const before = group === "index" ? inBase : inIndex;
        const after = group === "index" ? inIndex : inWork;
        if (!before && !after) continue;
        rows.push({
          old: before ? old++ : "", next: after ? next++ : "",
          kind: before === after ? " " : line.kind, code: line.code, key: lineKey(sectionIndex, index)
        });
      }
      const before = rows.filter((row) => row.old !== "");
      const after = rows.filter((row) => row.next !== "");
      const position = (items, key) => (items[0]?.[key] ?? 0) + "," + items.length;
      return { sectionIndex, label: section.label, rows, range: "@@ -" + position(before, "old") + " +" + position(after, "next") + " @@" };
    }).filter(({ rows }) => rows.some((row) => row.kind !== " "));
  }

  const getGroup = (file, group) => file.hunks.some(({ lines }) => lines.some((line) => groupOf(file, line) === group));
  const stagedFiles = () => files.filter((file) => getGroup(file, "index"));
  const currentDirty = () => files.filter((file) => file.hunks.some(({ lines }) => lines.some(isChanged)));
  const subject = find("[data-subject]");
  const body = find("[data-body]");
  const search = find("[data-search]");
  const groups = find("[data-groups]");
  const viewer = find("[data-viewer]");
  const list = find("[data-commit-list]");
  const detail = find("[data-history-detail]");
  const dialog = find("[data-sync-dialog]");

  function setStatus(message) {
    find("[data-status]").textContent = message;
  }

  function updateCompose() {
    const count = stagedFiles().length;
    const button = find("[data-commit]");
    button.querySelector("span").textContent = count ? "提交 " + count + " 个文件" : "提交";
    button.disabled = !count || !subject.value.trim();
    find("[data-commit-scope]").textContent = count ? "仅提交已暂存内容" : "暂存文件后即可提交";
  }

  function renderTitle() {
    const dirty = currentDirty().length;
    find("[data-dirty-count]").textContent = dirty;
    find("[data-ahead]").textContent = state.ahead || "";
    find('[data-sync="push"]').disabled = state.ahead === 0;
    const inWork = state.view === "workspace";
    find("[data-title]").textContent = inWork ? "工作区" : "提交历史";
    find("[data-subtitle]").textContent = inWork
      ? (dirty ? dirty + " 个文件有改动" : "工作区干净")
      : (state.ref || "所有引用") + " · " + visibleCommits().length + " 条提交";
    find("[data-search-box]").hidden = inWork;
  }

  function renderGroups() {
    groups.innerHTML = Object.entries(groupNames).map(([group, label]) => {
      const entries = files.filter((file) => getGroup(file, group));
      const rows = entries.map((file) => {
        const selected = state.file === file.id && state.group === group;
        const verb = group === "index" ? "取消暂存" : "暂存";
        const status = statusChip(file, group);
        const name = escape(file.name);
        return '<div class="file-entry' + (selected ? " is-current" : "") + '">' +
          '<button type="button" class="file-hit cursor-interaction" data-file="' + file.id + '" data-group="' + group +
          '" aria-pressed="' + selected + '" data-tooltip="' + escape(pathOf(file)) + '">' +
          status + '<span class="file-copy"><span class="filename truncate">' + name + '</span><span class="file-path truncate">' +
          escape(file.dir || "仓库根目录") + '</span></span></button>' +
          '<button type="button" class="file-action cursor-interaction" data-toggle-file="' + file.id + '" data-group="' +
          group + '" aria-label="' + verb + " " + name + '">' + (group === "index" ? "−" : "+") + '</button></div>';
      }).join("");
      return '<section aria-label="' + label + '"><div class="group-heading"><strong class="' +
        (group === "index" ? "index-color" : "") + '">' + label + '</strong><span>' + entries.length + '</span></div>' +
        (rows || '<span class="none">无文件</span>') + '</section>';
    }).join("");
  }

  const pathOf = (file) => file.dir ? file.dir + "/" + file.name : file.name;

  function statusChip(file, group) {
    const type = file.type === "?" && group === "index" ? "A" : file.type;
    const variant = type === "?" ? "unknown" : (type === "A" ? "add" : "");
    return '<span class="file-status ' + variant + '" aria-label="' + ({ "?": "未跟踪", A: "新增", M: "修改" })[type] + '">' + type + '</span>';
  }

  function syntax(code) {
    const token = /("[^"]*"|\b(?:func|if|return|const|package)\b|\b[A-Za-z]\w*(?=\())/g;
    let result = "";
    let previous = 0;
    for (const match of code.matchAll(token)) {
      const word = match[0];
      const type = word.startsWith('"') ? "string" : /^(func|if|return|const|package)$/.test(word) ? "key" : "call";
      result += escape(code.slice(previous, match.index)) + '<span class="token-' + type + '">' + escape(word) + '</span>';
      previous = match.index + word.length;
    }
    return result + escape(code.slice(previous));
  }

  function codeRow(row, selectable, side = "") {
    if (!row) return '<div class="code-row spacer" aria-hidden="true"></div>';
    const type = row.kind === "+" ? " addition" : row.kind === "-" ? " deletion" : "";
    const numbers = (side === "after" ? "" : '<span class="num">' + row.old + '</span>') +
      (side === "before" ? "" : '<span class="num">' + row.next + '</span>');
    const text = numbers + '<span class="sign">' + (row.kind === "-" ? "−" : row.kind) +
      '</span><code class="code">' + syntax(row.code.replace(/\t/g, "  ")) + '</code>';
    return selectable && type
      ? '<button type="button" class="code-row cursor-interaction' + type + '" data-line="' + row.key +
        '" aria-pressed="' + state.selected.has(row.key) + '">' + text + '</button>'
      : '<div class="code-row' + type + '">' + text + '</div>';
  }

  function splitRows(rows, selectable) {
    let output = "";
    let removed = [];
    let added = [];
    const pair = (before, after) => '<div class="split-row">' +
      codeRow(before, selectable, "before") + codeRow(after, selectable, "after") + '</div>';
    const flush = () => {
      const length = Math.max(removed.length, added.length);
      for (let i = 0; i < length; i += 1) output += pair(removed[i], added[i]);
      removed = [];
      added = [];
    };
    for (const row of rows) {
      if (row.kind === "-") removed.push(row);
      else if (row.kind === "+") added.push(row);
      else {
        flush();
        output += pair(row, row);
      }
    }
    flush();
    return output;
  }

  function patchHTML(patches, { partial, split, unstage, index }) {
    const labels = split ? '<div class="split-head muted"><span>' + (index ? "HEAD" : "Index") +
      '</span><span>' + (index ? "Index" : "工作树") + '</span></div>' : "";
    return labels + patches.map(({ sectionIndex, range, label, rows }) => {
      const count = rows.filter((line) => line.kind !== " ").length;
      const action = partial ? '<button type="button" class="control cursor-interaction" data-hunk="' +
        sectionIndex + '">' + (unstage ? "取消暂存片段" : "暂存片段") + '</button>' : "";
      return '<div class="patch"><div class="hunk-head"><span class="mono truncate"><span class="position">' +
        escape(range) + '</span> <span class="scope">' + escape(label || count + " 行改动") +
        '</span></span>' + action + '</div>' +
        (split ? splitRows(rows, partial) : rows.map((row) => codeRow(row, partial)).join("")) + '</div>';
    }).join("");
  }

  function renderDiff() {
    const file = files.find((item) => item.id === state.file);
    if (!file || !getGroup(file, state.group)) {
      viewer.innerHTML = '<p class="empty">' + (currentDirty().length ? "选择一个文件查看改动。" : "没有待处理的文件改动。") + '</p>';
      return;
    }
    const unstage = state.group === "index";
    const partial = file.type === "M";
    const patches = projections(file, state.group);
    const rows = patches.flatMap((patch) => patch.rows);
    const added = rows.filter((row) => row.kind === "+").length;
    const removed = rows.filter((row) => row.kind === "-").length;
    viewer.innerHTML = '<header class="diff-header"><div class="diff-heading"><h3>' + icon("file-code-2") +
      '<span class="truncate">' + escape(file.name) + '</span></h3><p class="mono muted truncate">' +
      escape(file.dir ? file.dir + "/" : "仓库根目录") + ' · ' + groupNames[state.group] +
      '</p></div><div class="diff-actions"><span class="stats" aria-label="新增 ' + added + ' 行，删除 ' + removed +
      ' 行"><span class="plus">+' + added + '</span><span class="minus">−' + removed +
      '</span></span><div class="segment" aria-label="Diff 布局">' +
      '<button type="button" class="cursor-interaction" data-layout="unified" aria-pressed="' + !state.split + '">统一</button>' +
      '<button type="button" class="cursor-interaction" data-layout="split" aria-pressed="' + state.split + '">并排</button></div>' +
      '<button type="button" class="control cursor-interaction" data-toggle-file="' + file.id + '" data-group="' +
      state.group + '">' + (unstage ? "取消暂存文件" : "暂存文件") + '</button></div></header>' +
      patchHTML(patches, { partial, split: state.split, unstage, index: unstage }) +
      '<div class="selection-footer" data-selection-footer></div>';
    renderSelection();
  }

  function renderSelection() {
    const footer = find("[data-selection-footer]");
    if (!footer) return;
    const unstage = state.group === "index";
    const count = state.selected.size;
    const description = count ? "已选 " + count + " 行" :
      (unstage ? "HEAD → Index" : "Index → 工作树") + " · " +
      (state.split ? "并排" : "统一") + " Diff";
    footer.innerHTML = '<span aria-live="polite">' + description + '</span>' +
      (count ? '<button type="button" class="control cursor-interaction" data-apply-selection>' +
      (unstage ? "取消暂存所选行" : "暂存所选行") + '</button>' : "");
  }

  function updateWorkspace() {
    renderGroups();
    renderDiff();
    updateCompose();
    renderTitle();
    icons();
  }

  function changeStage(file, group, predicate) {
    const stage = group !== "index";
    let count = 0;
    file.hunks.forEach(({ lines }, sectionIndex) => {
      lines.forEach((line, rowIndex) => {
        if (groupOf(file, line) === group && predicate(sectionIndex, rowIndex)) {
          line.staged = stage;
          count += 1;
        }
      });
    });
    if (count === 0) return;
    if (state.file === file.id && !getGroup(file, state.group)) {
      state.group = Object.keys(groupNames).find((candidate) => getGroup(file, candidate));
    }
    state.selected.clear();
    updateWorkspace();
    setStatus((stage ? "已暂存 " : "已取消暂存 ") + file.name + " · " + count + " 行");
  }

  function reachableFrom(hash) {
    const pending = [hash];
    const visited = new Set();
    while (pending.length) {
      const next = pending.pop();
      if (!next || visited.has(next)) continue;
      visited.add(next);
      pending.push(...(history.find((commit) => commit.hash === next)?.parents ?? []));
    }
    return visited;
  }

  function visibleCommits() {
    const query = search.value.trim().toLowerCase();
    const filter = state.ref ? reachableFrom(history.find((commit) => commit.refs.includes(state.ref))?.hash) : null;
    return history.filter((commit) => (!filter || filter.has(commit.hash)) &&
      [commit.hash, commit.subject, commit.author, ...commit.refs].join(" ").toLowerCase().includes(query));
  }

  function graph(commits) {
    if (!commits.length) return;
    list.querySelector(".dag")?.remove();
    const rowHeight = list.querySelector(".commit-row").getBoundingClientRect().height;
    if (!rowHeight) return;
    const width = 58;
    const height = rowHeight * commits.length;
    const positions = new Map(commits.map((commit, index) => [
      commit.hash, { x: 14 + commit.lane * 14, y: rowHeight * (index + .5) }
    ]));
    const edges = [];
    const nodes = [];
    for (const commit of commits) {
      const { x, y } = positions.get(commit.hash);
      for (const hash of commit.parents) {
        const to = positions.get(hash);
        if (to) {
          const bend = Math.min(11, (to.y - y) / 2);
          const d = x === to.x
            ? "M" + x + " " + y + "V" + to.y
            : "M" + x + " " + y + "L" + to.x + " " + (y + bend) + "V" + to.y;
          edges.push('<path d="' + d + '" class="lane-' + commit.lane +
            '" fill="none" stroke="currentColor" stroke-width="1.5"/>');
        } else {
          edges.push('<path d="M' + x + " " + y + "v" + (rowHeight * .42) + '" class="lane-' +
            commit.lane + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/>');
        }
      }
      const isMerge = commit.parents.length > 1;
      const isHead = commit.refs.includes(branch);
      const radius = isHead || isMerge ? 4.4 : 3.25;
      nodes.push('<circle cx="' + x + '" cy="' + y + '" r="' + radius + '" class="lane-' + commit.lane +
        '" fill="' + (isMerge ? "var(--sg-panel)" : "currentColor") +
        '" stroke="currentColor" stroke-width="1.5"/>');
    }
    list.insertAdjacentHTML("beforeend", '<svg class="dag" aria-hidden="true" viewBox="0 0 ' + width +
      ' ' + height + '" width="' + width + '" height="' + height + '">' + edges.join("") + nodes.join("") + '</svg>');
  }

  function refBadge(ref, trim = false) {
    const alt = ref === "main" || ref === "origin/main" || ref.startsWith("v");
    const label = trim && ref === branch ? "HEAD" : ref;
    return '<span class="ref-badge truncate' + (alt ? " alt" : "") + '">' + escape(label) + '</span>';
  }

  function renderHistory() {
    const commits = visibleCommits();
    if (!commits.some((commit) => commit.hash === state.commit)) {
      state.commit = commits[0]?.hash ?? "";
      state.historyFile = "";
    }
    list.innerHTML = commits.map((commit) => {
      const ref = commit.refs[0];
      return '<button type="button" class="commit-row cursor-interaction" data-sha="' + commit.hash +
        '" aria-pressed="' + (commit.hash === state.commit) + '" data-tooltip="' + escape(commit.subject) +
        '"><span></span><span class="commit-title-line"><span class="truncate">' + escape(commit.subject) +
        '</span>' + (ref ? refBadge(ref, true) : "") + '</span><span class="mono muted">' + commit.hash + '</span></button>';
    }).join("") || '<p class="empty">没有匹配的提交。</p>';
    graph(commits);
    renderHistoryDetail();
    renderTitle();
  }

  function renderHistoryDetail() {
    const commit = history.find(({ hash }) => hash === state.commit);
    if (!commit) {
      detail.innerHTML = '<p class="empty">清除搜索条件以查看提交详情。</p>';
      return;
    }
    const file = commit.files.find(({ id }) => id === state.historyFile);
    detail.innerHTML = '<header class="diff-header"><h3>提交详情</h3><div class="segment" aria-label="提交详情视图">' +
      '<button type="button" class="cursor-interaction" data-commit-mode="summary" aria-pressed="' + !file + '">摘要</button>' +
      '<button type="button" class="cursor-interaction" data-commit-mode="files" aria-pressed="' + !!file + '">文件 · ' +
      commit.files.length + '</button></div></header><div class="summary"><h3>' + escape(commit.subject) +
      '</h3>' + (commit.refs.length ? '<div class="refs">' + commit.refs.map((ref) => refBadge(ref)).join("") + '</div>' : "") +
      (file ? "" : '<p class="description">' + escape(commit.description) + '</p><dl><dt>SHA</dt><dd class="mono">' +
        commit.hash + '</dd><dt>作者</dt><dd>' + escape(commit.author) + '</dd><dt>时间</dt><dd class="mono">2026-' + commit.date +
        '</dd><dt>父提交</dt><dd class="mono">' + (commit.parents.map((hash) => '<button type="button" class="text-action cursor-interaction" data-parent="' +
        hash + '">' + hash + '</button>').join(" · ") || "无") + '</dd></dl>') + '</div>' +
      '<div class="history-files"><div class="group-heading"><strong>改动文件</strong><span>' + commit.files.length +
      '</span></div>' + commit.files.map((entry) => '<button type="button" class="file-hit cursor-interaction" data-history-file="' +
        entry.id + '" aria-pressed="' + (entry === file) + '">' + statusChip(entry, "index") +
        '<span class="filename truncate">' + escape(pathOf(entry)) + '</span></button>').join("") + '</div>' +
      (file ? '<div class="history-patch">' + patchHTML(projections(file, "work"), {}) + '</div>' : "");
    icons();
  }

  function show(view) {
    state.view = view;
    for (const panel of all("[data-panel]")) panel.hidden = panel.dataset.panel !== view;
    for (const button of all("[data-view]")) {
      if (button.dataset.view === view) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    }
    for (const button of all("[data-ref]")) {
      button.setAttribute("aria-pressed", String(view === "history" && button.dataset.ref === state.ref));
    }
    if (view === "history") renderHistory();
    else renderTitle();
  }

  function commitIndex() {
    const staged = stagedFiles();
    const message = subject.value.trim();
    if (!staged.length || !message) return;
    const committedFiles = staged.map((file) => ({
      ...file,
      type: file.type === "?" ? "A" : file.type,
      hunks: file.hunks.map((section) => ({
        ...section,
        lines: section.lines.flatMap((line) => {
          if ((line.staged && isChanged(line)) || line.kind === " ") return [{ ...line, committed: false, staged: false }];
          if ((line.kind === "+" && line.committed) || (line.kind === "-" && !line.committed)) {
            return [{ ...line, kind: " ", committed: false, staged: false }];
          }
          return [];
        })
      }))
    }));
    for (const file of staged) {
      for (const { lines } of file.hunks) {
        for (const line of lines) {
          if (!line.staged) continue;
          line.committed = true;
          line.staged = false;
        }
      }
    }
    const previous = history.find((commit) => commit.refs.includes(branch));
    previous.refs = previous.refs.filter((ref) => ref !== branch);
    const hash = (0xf462ac1 + state.created++).toString(16);
    history.unshift({
      hash, subject: message, author: "Adam", date: "11-16 15:04", lane: 0, parents: [previous.hash],
      refs: [branch], description: body.value.trim(), files: committedFiles
    });
    state.commit = hash;
    state.historyFile = "";
    state.ahead += 1;
    const selection = currentDirty().find((file) => file.id === state.file) ?? currentDirty()[0];
    state.file = selection?.id ?? "";
    state.group = selection ? Object.keys(groupNames).find((group) => getGroup(selection, group)) : "";
    state.selected.clear();
    subject.value = "";
    body.value = "";
    updateWorkspace();
    setStatus("已提交 " + hash + " · " + staged.length + " 个文件");
  }

  root.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button || !root.contains(button) || button.disabled) return;
    const data = button.dataset;
    if ("view" in data) {
      state.ref = "";
      show(data.view);
    } else if ("ref" in data) {
      state.ref = state.ref === data.ref ? "" : data.ref;
      search.value = "";
      if (state.ref) state.commit = history.find((commit) => commit.refs.includes(state.ref)).hash;
      state.historyFile = "";
      show("history");
    } else if ("appearanceToggle" in data) {
      const appearance = root.dataset.appearance;
      const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
      const next = appearance === "system" ? (systemDark ? "light" : "dark") :
        (appearance === (systemDark ? "light" : "dark") ? (systemDark ? "dark" : "light") : "system");
      root.dataset.appearance = next;
      button.querySelector("span").textContent = { light: "浅色外观", dark: "深色外观", system: "跟随系统" }[next];
    } else if ("file" in data) {
      state.file = data.file;
      state.group = data.group;
      state.selected.clear();
      for (const entry of all("[data-file]")) {
        const active = entry === button;
        entry.setAttribute("aria-pressed", String(active));
        entry.closest(".file-entry").classList.toggle("is-current", active);
      }
      renderDiff();
      icons();
    } else if ("layout" in data) {
      state.split = data.layout === "split";
      renderDiff();
      icons();
      find('[data-layout="' + data.layout + '"]').focus();
    } else if ("line" in data) {
      const key = data.line;
      if (state.selected.has(key)) state.selected.delete(key);
      else state.selected.add(key);
      button.setAttribute("aria-pressed", String(state.selected.has(key)));
      renderSelection();
    } else if ("toggleFile" in data || "hunk" in data || "applySelection" in data) {
      const file = files.find((item) => item.id === (data.toggleFile || state.file));
      const group = data.group || state.group;
      const predicate = (section, row) => {
        if ("hunk" in data) return section === Number(data.hunk);
        if ("applySelection" in data) return state.selected.has(lineKey(section, row));
        return true;
      };
      changeStage(file, group, predicate);
      if (button === document.activeElement || document.activeElement === document.body) {
        find('[data-file="' + file.id + '"][data-group="' + state.group + '"]')?.focus();
      }
    } else if ("sha" in data || "parent" in data) {
      state.commit = data.sha || data.parent;
      state.historyFile = "";
      if ("parent" in data && !visibleCommits().some((commit) => commit.hash === state.commit)) {
        search.value = "";
        state.ref = "";
      }
      show("history");
      find('[data-sha="' + state.commit + '"]')?.focus();
    } else if ("commitMode" in data || "historyFile" in data) {
      const commit = history.find(({ hash }) => hash === state.commit);
      state.historyFile = data.historyFile || (data.commitMode === "files" ? commit.files[0].id : "");
      renderHistoryDetail();
      const selector = data.historyFile ? '[data-history-file="' + data.historyFile + '"]' : '[data-commit-mode="' + data.commitMode + '"]';
      find(selector)?.focus();
    } else if ("commit" in data) {
      commitIndex();
    } else if ("syncChoice" in data) {
      dialog.close(data.syncChoice);
    } else if (data.sync === "fetch" || data.sync === "pull") {
      setStatus(data.sync === "fetch" ? "上次 Fetch · 刚刚" : "Pull 完成 · 本地已包含远端提交");
    } else if (data.sync === "push" && !dialog.open) {
      dialog.returnValue = "";
      find("#sg-sync-heading").textContent = "推送 " + state.ahead + " 个提交";
      find("[data-sync-target]").textContent = branch + " → " + upstream;
      dialog.showModal();
    }
  });

  dialog.addEventListener("close", () => {
    if (dialog.returnValue !== "push") return;
    for (const commit of history) {
      commit.refs = commit.refs.filter((ref) => ref !== upstream);
    }
    history.find((commit) => commit.refs.includes(branch)).refs.push(upstream);
    state.ahead = 0;
    if (state.view === "history") renderHistory();
    else renderTitle();
    setStatus("已推送到 " + upstream);
  });
  find("[data-compose]").addEventListener("submit", (event) => {
    event.preventDefault();
    commitIndex();
  });
  subject.addEventListener("input", updateCompose);
  search.addEventListener("input", renderHistory);
  root.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && state.view === "workspace" && !dialog.open) {
      event.preventDefault();
      commitIndex();
    }
  });
  new ResizeObserver(() => {
    if (state.view === "history") graph(visibleCommits());
  }).observe(find(".window"));

  updateWorkspace();
})();
</script>
